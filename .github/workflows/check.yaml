# The check of this repository. It judges pull requests and master, and never publishes.
#
# `check` is the one aggregate job: the organisation's ruleset requires a check of that name, and waives it for a repository until a
# CI reports it. It fails when any other job fails, is cancelled or is skipped, so that adding a job here needs no change in the rules.
#
# - docs: every YAML file parses, every relative markdown link and its anchor resolves, and the requirement rows are well formed
#   (.github/scripts/check.py).
# - build and test: every Go module (go.work) and every Rust crate of the workspace, on a runner of each architecture;
#   nothing is cross-compiled.
# - lint: golangci-lint, rustfmt and clippy, the shell scripts and the workflows.
# - supply chain: the licences of the Rust dependencies (deny.toml) and known advisories (govulncheck, cargo audit).
# - release rehearsal: the release flow on a throw-away copy with fixture libraries, and the candidate scripts on fixtures
#   (docs/release.md, "The rehearsals"). No tag is made here.
# - release candidate (rehearsal): candidate.yaml with the version 0.0.0, when the change can affect the release; otherwise it does
#   nothing and succeeds. Nothing is published.
#
# A push to master never cancels and never shares a group with the commit before it: the release gate (tools/release/gate.sh) needs a
# finished, green run of this workflow on the commit it publishes.
name: Check

on:
  pull_request:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyyaml==6.0.2
      - name: Check YAML, links and requirement rows
        run: |
          "$RUNNER_TEMP/venv/bin/python" .github/scripts/check.py

  build-test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@82e404675ef3f826755e2939d1072cddcd07ed26 # v3.9.0
      - run: devbox run -- just build test

  lint:
    name: lint (Go, Rust, shell, workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@82e404675ef3f826755e2939d1072cddcd07ed26 # v3.9.0
      - run: devbox run -- just lint

  supply:
    name: supply chain (licences, advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@82e404675ef3f826755e2939d1072cddcd07ed26 # v3.9.0
      - run: devbox run -- just check-licenses check-advisories

  release-rehearsal:
    name: release rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: truvity/ci-actions/setup-devbox@82e404675ef3f826755e2939d1072cddcd07ed26 # v3.9.0
      - run: devbox run -- just release-rehearsal release-candidate-test

  release-candidate:
    name: release candidate (rehearsal)
    uses: ./.github/workflows/candidate.yaml
    with:
      rehearsal: true
    permissions:
      contents: read

  # The one required check. It passes only when every job above succeeded: a failed, cancelled or skipped job fails it.
  check:
    name: check
    if: ${{ always() }}
    needs: [docs, build-test, lint, supply, release-rehearsal, release-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::not successful: $bad"
            exit 1
          fi
