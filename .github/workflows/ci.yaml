# Calls the shared workflow (truvity/ci-workflows), which runs each
# Justfile recipe as its OWN parallel job, reported under its own name.
#
# Pinned by COMMIT SHA, never a tag — tags move, and this code runs in
# every repository of both organizations.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `check` is the hermetic gate: it needs nothing but this checkout — no
  # containers, no network, no C toolchain — so that a contributor can run
  # exactly what CI runs. What needs more is its own job below; locally,
  # `just conformance` runs the service-backed tests and `just ts` the
  # TypeScript package.
  recipes:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@ea3c238133634f69f0c51240ede27bb270e24dc0 # v3.0.1
    with:
      recipes: '["build", "test", "lint", "proto", "drift", "schemas", "chart", "vuln", "leak-canary"]'

  # The race detector is the one thing here that needs a C toolchain, and
  # everything else builds with cgo off — which is what makes the binaries
  # static. Putting it in `check` would mean every contributor needs one to
  # run the gate at all.
  race:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@ea3c238133634f69f0c51240ede27bb270e24dc0 # v3.0.1
    with:
      recipes: '["race"]'

  # The TypeScript half of the generated-code check. It needs the plugin
  # from a remote registry that rate limits, and a gate that fails because
  # somebody else was generating code is a gate people learn to ignore.
  drift-ts:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@ea3c238133634f69f0c51240ede27bb270e24dc0 # v3.0.1
    with:
      recipes: '["drift-ts"]'

  # The index is the one part of this repository that cannot be tested
  # without a database, and mocking it would prove nothing about the
  # idempotency that is its whole contract. The tests skip when
  # AUDIT_POSTGRES_URL is unset, so this job is what makes them run.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same settings devbox.json gives every other job. This job cannot go
    # through devbox — it needs a service container the shared workflow does
    # not offer — so the step below holds the two toolchains to one version.
    env:
      AUDIT_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/audit_test?sslmode=disable
      CGO_ENABLED: "0"
      GOEXPERIMENT: jsonv2
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
      - name: one Go for every job
        # devbox.json pins the Go every other job runs; go.mod pins this one.
        # Two toolchains for one module is how "passes in one job, fails in
        # another" starts, so the pins have to agree.
        run: |
          want=$(sed -n 's/^go \([0-9.]*\).*/\1/p' go.mod)
          have=$(python3 -c 'import json;print(json.load(open("devbox.json"))["packages"]["go"])')
          [ "$want" = "$have" ] || { echo "go.mod wants go $want, devbox.json pins $have"; exit 1; }
      - name: go test ./... with a database
        run: go test ./...
      - name: the Postgres tests must have run, not skipped
        # A URL that stopped reaching the tests would turn this job green
        # while proving nothing, which is the failure mode these tests were
        # written to avoid in the first place.
        run: |
          go test ./index/postgres/ -run TestMigrateIsIdempotent -v | tee out.txt
          grep -q -- "--- PASS: TestMigrateIsIdempotent" out.txt

  # The archive walks against a real S3. Two bugs reached master because
  # storetest.Memory returns everything, in any layout, on one page; this is
  # the job that would have caught both.
  #
  # The image is pinned by digest and is the community 4.x line: LocalStack's
  # `latest` and `stable` now resolve to a licensed build that exits without a
  # token, which in a public repository would fail every fork's CI with a
  # licensing message its author cannot fix.
  s3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      s3:
        image: localstack/localstack@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
        env:
          SERVICES: s3,kms
        ports: ["4566:4566"]
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      AUDIT_S3_URL: http://localhost:4566
      CGO_ENABLED: "0"
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
      - name: the archive walks against real S3
        run: go test ./internal/s3test/... ./store/...
      - name: the S3 tests must have run, not skipped
        # Same guard as the Postgres job: an endpoint that stopped reaching the
        # tests would turn this green while proving nothing, which is the exact
        # failure these tests exist to prevent.
        run: |
          go test ./internal/s3test/ -run TestPrefixesListsEveryTenant -v | tee out.txt
          grep -q -- "--- PASS: TestPrefixesListsEveryTenant" out.txt

  # The transit key provider and signer against a real OpenBAO. A provider
  # tested against a stand-in would prove only that it called the API it
  # meant to; these run the policies, the logins and the erasure for real.
  # The image is pinned by digest, and runs as a service container because
  # its default command is the dev server: the environment is all it needs.
  openbao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      openbao:
        image: openbao/openbao@sha256:597f62847dd382382056a1d6704d50465908c2040038c4611832a23269a67112
        env:
          BAO_DEV_ROOT_TOKEN_ID: root
          BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports: ["8200:8200"]
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8200/v1/sys/health"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AUDIT_OPENBAO_URL: http://localhost:8200
      AUDIT_OPENBAO_TOKEN: root
      CGO_ENABLED: "0"
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
      - name: the transit keys and signer against OpenBAO
        run: go test ./keys/... ./internal/writer/...
      - name: the OpenBAO tests must have run, not skipped
        # The same guard as the Postgres and S3 jobs.
        run: |
          go test ./keys/ -run TestTransitReplicasAgreeAndPurposesDoNot -v | tee out.txt
          grep -q -- "--- PASS: TestTransitReplicasAgreeAndPurposesDoNot" out.txt

  # The TypeScript package: install, typecheck, test, build, and check what a
  # publish would ship. It installs from the registry, which is why it is not
  # in `check`.
  ts:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@ea3c238133634f69f0c51240ede27bb270e24dc0 # v3.0.1
    with:
      recipes: '["ts"]'

  # Stable name for branch protection: the matrix reports as
  # "recipes / lint" and so on, so a required context called "check"
  # would never arrive and every PR would hang waiting for it.
  check:
    needs: [recipes, race, drift-ts, postgres, s3, openbao, ts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          [ "${{ needs.recipes.result }}" = "success" ] &&
          [ "${{ needs.race.result }}" = "success" ] &&
          [ "${{ needs.drift-ts.result }}" = "success" ] &&
          [ "${{ needs.postgres.result }}" = "success" ] &&
          [ "${{ needs.s3.result }}" = "success" ] &&
          [ "${{ needs.openbao.result }}" = "success" ] &&
          [ "${{ needs.ts.result }}" = "success" ]
