# Tag-triggered release — the shared implementation (truvity/ci-workflows).
# goreleaser builds the `audit` toolchain as archives, so that an auditor
# can run `verify` with a copy of their own, and, through ko, the three
# images the chart deploys. The chart itself is packaged at the tag's
# version and pushed to oci://ghcr.io/truvity/charts/audit.
#
# The caller grants the permissions because a reusable workflow can
# narrow them but never widen them.
#
# The repository holds three Go modules, the root, sdk/ and deploy/pulumi/; the
# `sdk-tag` job below adds the others' tags, `sdk/vX.Y.Z` and
# `deploy/pulumi/vX.Y.Z`, beside the first.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# Never cancel a running publish — a half-pushed artifact set is worse
# than a queued wait.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@58d470dff71c732e208f47a80bb6c5d741e016a7 # v3.25.0
    with:
      charts: '["audit"]'
      # The CLI as a Nix flake, one release asset, so that another
      # repository's devbox can pin `audit verify` by hash the way it pins
      # accessctl: an auditor's copy of the verifier should be the one they
      # chose, not the one on the path.
      nix-flakes: '["audit"]'
      # Four images under one path, as the chart's values name them:
      # ko appends each command's import-path base to this.
      ko-docker-repo: ghcr.io/truvity/audit

  # A Go module in a subdirectory is released by a tag that carries the
  # directory: `sdk/vX.Y.Z` is how `go get github.com/truvity/audit/sdk@vX.Y.Z`
  # finds it, and a plain `vX.Y.Z` does not. release-public.yaml
  # (truvity/ci-workflows) cuts nothing but the tag that triggered it, so this
  # job adds the SDK's at the same commit, once the release itself succeeded:
  # the release contract has one tag stamp everything, at one version.
  #
  # Idempotent, so that a re-run of a release does not fail on its own tag, and
  # a tag a person pushed by hand (signed, annotated) counts when it peels to
  # the release commit. It refuses a tag that already exists at another
  # commit: a tag fetched once cannot be taken back, and the proxy remembers
  # the first.
  sdk-tag:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: tag the SDK module and the Pulumi library at the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # deploy/pulumi is a module of its own (github.com/truvity/audit/deploy/pulumi),
          # so that Pulumi is not in the root's dependency graph; it is tagged the
          # same way, and does not depend on the root or the SDK.
          for dir in sdk deploy/pulumi; do
            tag="$dir/${GITHUB_REF_NAME}"
            if ref=$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha' 2>/dev/null); then
              read -r otype existing <<<"$ref"
              # A signed or annotated tag is an object of its own: the ref
              # points at the tag object and only its peeled target is the
              # commit. Compare the commit, never the tag object.
              while [ "$otype" = "tag" ]; do
                read -r otype existing < <(gh api "repos/$REPO/git/tags/$existing" --jq '.object.type + " " + .object.sha')
              done
              if [ "$otype" = "commit" ] && [ "$existing" = "$GITHUB_SHA" ]; then
                echo "$tag already points at $GITHUB_SHA"
                continue
              fi
              echo "::error::$tag exists at $existing ($otype), not at the release commit $GITHUB_SHA"
              exit 1
            fi
            gh api "repos/$REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" --jq .ref
          done
