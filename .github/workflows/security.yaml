# Third-party actions are pinned to commit SHAs (exact version tag noted
# inline) so this repo starts clean on the unpinned-actions CodeQL finding.
name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  # The same recipe `check.yaml`'s `recipes` list ran until this PR,
  # moved here so it is no longer required for `check` to go green.
  #
  # Deliberately NOT in ci.yaml's recipe list, and deliberately not a
  # required context. A standard-library advisory with no released fix
  # would otherwise wedge every pull request on a finding nobody can act
  # on.
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@30b989fdd77b99af4be1a4b04e6353aa58aa3923 # v3.21.0
    with:
      recipes: '["vuln"]'
