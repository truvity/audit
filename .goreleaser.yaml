# Releases: the `audit` toolchain as archives, so that an auditor can run
# `verify` with their own copy and nothing that has to be trusted; and one
# image per binary, built by ko without a container runtime. The images are
# distroless and have no shell, which is why every job in the chart is a
# command with arguments and never a script.
version: 2
project_name: audit

builds:
  - id: audit
    main: ./cmd/audit
    binary: audit
    env: [CGO_ENABLED=0, GOEXPERIMENT=jsonv2]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]
  - id: audit-query
    main: ./cmd/audit-query
    binary: audit-query
    env: [CGO_ENABLED=0, GOEXPERIMENT=jsonv2]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]
  - id: audit-registry
    main: ./cmd/audit-registry
    binary: audit-registry
    env: [CGO_ENABLED=0, GOEXPERIMENT=jsonv2]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]
  - id: audit-writer
    main: ./cmd/audit-writer
    binary: audit-writer
    env: [CGO_ENABLED=0, GOEXPERIMENT=jsonv2]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]

# One archive shape for every platform. Mixed formats are what breaks the
# download step of whatever installs these.
archives:
  - id: audit
    ids: [audit]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

kos:
  - id: audit-writer
    build: audit-writer
    # Named here as well as in KO_DOCKER_REPO, and the same value in both,
    # so `goreleaser check` validates in a checkout that has no env — the
    # lint recipe runs it without one.
    repositories: [ghcr.io/truvity/audit]
    bare: true
    preserve_import_paths: false
    # The image name is the command's import-path base appended to
    # KO_DOCKER_REPO, which the shared release workflow exports as
    # ghcr.io/truvity/audit — so ./cmd/audit-writer publishes
    # ghcr.io/truvity/audit/audit-writer. A per-ko `repositories:` list does
    # NOT win over that env var: v0.1.0 set one and ko still pushed
    # to ghcr.io/truvity itself, which the registry answered with a
    # 400. This is the shape access-roster publishes its two images
    # with, and the chart's defaults name the same paths.
    base_import_paths: true
    base_image: cgr.dev/chainguard/static:latest
    platforms: [linux/amd64, linux/arm64]
    tags: ["{{ .Version }}", latest]
    sbom: spdx
  - id: audit-query
    build: audit-query
    # Named here as well as in KO_DOCKER_REPO, and the same value in both,
    # so `goreleaser check` validates in a checkout that has no env — the
    # lint recipe runs it without one.
    repositories: [ghcr.io/truvity/audit]
    bare: true
    preserve_import_paths: false
    # The image name is the command's import-path base appended to
    # KO_DOCKER_REPO, which the shared release workflow exports as
    # ghcr.io/truvity/audit — so ./cmd/audit-query publishes
    # ghcr.io/truvity/audit/audit-query. A per-ko `repositories:` list does
    # NOT win over that env var: v0.1.0 set one and ko still pushed
    # to ghcr.io/truvity itself, which the registry answered with a
    # 400. This is the shape access-roster publishes its two images
    # with, and the chart's defaults name the same paths.
    base_import_paths: true
    base_image: cgr.dev/chainguard/static:latest
    platforms: [linux/amd64, linux/arm64]
    tags: ["{{ .Version }}", latest]
    sbom: spdx
  - id: audit-registry
    build: audit-registry
    # Named here as well as in KO_DOCKER_REPO, and the same value in both,
    # so `goreleaser check` validates in a checkout that has no env — the
    # lint recipe runs it without one.
    repositories: [ghcr.io/truvity/audit]
    bare: true
    preserve_import_paths: false
    # The image name is the command's import-path base appended to
    # KO_DOCKER_REPO, which the shared release workflow exports as
    # ghcr.io/truvity/audit — so ./cmd/audit-registry publishes
    # ghcr.io/truvity/audit/audit-registry. A per-ko `repositories:` list does
    # NOT win over that env var: v0.1.0 set one and ko still pushed
    # to ghcr.io/truvity itself, which the registry answered with a
    # 400. This is the shape access-roster publishes its two images
    # with, and the chart's defaults name the same paths.
    base_import_paths: true
    base_image: cgr.dev/chainguard/static:latest
    platforms: [linux/amd64, linux/arm64]
    tags: ["{{ .Version }}", latest]
    sbom: spdx
  - id: audit
    build: audit
    # Named here as well as in KO_DOCKER_REPO, and the same value in both,
    # so `goreleaser check` validates in a checkout that has no env — the
    # lint recipe runs it without one.
    repositories: [ghcr.io/truvity/audit]
    bare: true
    preserve_import_paths: false
    # The image name is the command's import-path base appended to
    # KO_DOCKER_REPO, which the shared release workflow exports as
    # ghcr.io/truvity/audit — so ./cmd/audit publishes
    # ghcr.io/truvity/audit/audit. A per-ko `repositories:` list does
    # NOT win over that env var: v0.1.0 set one and ko still pushed
    # to ghcr.io/truvity itself, which the registry answered with a
    # 400. This is the shape access-roster publishes its two images
    # with, and the chart's defaults name the same paths.
    base_import_paths: true
    base_image: cgr.dev/chainguard/static:latest
    platforms: [linux/amd64, linux/arm64]
    tags: ["{{ .Version }}", latest]
    sbom: spdx

# Named rather than inferred from the remote, so the config validates in a
# checkout that has none.
release:
  github:
    owner: truvity
    name: audit

checksum:
  name_template: checksums.txt
snapshot:
  version_template: "{{ incpatch .Version }}-next"
# CHANGELOG.md is written by hand and says what changed; a list of commit
# subjects would say less and stand beside it.
changelog:
  disable: true
