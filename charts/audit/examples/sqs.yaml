# An installation on AWS that queues through SQS instead of NATS: a receiver in
# front publishes to a queue, writers consume it and write the archive.
#
# There is no credential in this file or in a Secret for the queue. The pods
# use the AWS SDK's ambient credentials, which on EKS is the pod's workload
# identity: bind the release's service account to a role (EKS Pod Identity is an
# association made outside the chart; IRSA is the annotation below) that may
# send to and receive from the queue and put to the archive's bucket. Everything
# not named here has a default. Each `config:` block is the binary's own
# configuration, key for key (docs/reference/configuration.md).
mode: stream

profiles:
  security:
    presets: [security]
externalIdentifiersAreOpaque: true

replicas: 2

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: ROLE-ARN-OF-THE-AUDIT-ROLE

workloadIdentity:
  issuers:
    - url: https://oidc.example.com/id/CLUSTER
  workloads:
    - subject: system:serviceaccount:app:api
      source: app

migrate:
  enabled: true
  config:
    apiVersion: audit.truvity.github.io/audit-migrate/v2
    secrets:
      source: file
      root: /etc/audit/secrets
    # The OWNER of the tables, which no part connects as. Each role below must
    # exist, and is granted what its part needs and nothing else.
    database:
      url: postgres://audit_owner@db.example.com:5432/audit?sslmode=verify-full
      passwordSecret: database-password
    writer: audit_writer
    observe: audit_observe
  secretFiles:
    - name: database-password
      secretName: audit-db-owner
      key: password

# The receiver forwards to the queue, and is held to `queued`: it holds no
# archive, so that is the most it can promise, and a queue that is not there or
# a log in its place is a refusal at start-up rather than a gap in the trail.
receiver:
  config:
    apiVersion: audit.truvity.github.io/audit-writer/v2
    secrets:
      source: file
      root: /etc/audit/secrets
    mode: receiver
    require: queued
    deployment: /etc/audit/deployment.yaml
    workloads: /etc/audit/workloads.yaml
    database:
      url: postgres://audit_writer@db.example.com:5432/audit?sslmode=verify-full
      passwordSecret: database-password
    forward:
      sqs:
        queueUrl: https://sqs.eu-west-1.amazonaws.com/ACCOUNT/audit.fifo
        region: eu-west-1
        fifo: true
  secretFiles:
    - name: database-password
      secretName: audit-db
      key: password

# The writers consume the same queue. A message is deleted only once its
# records are in the archive, so a writer that is down leaves a backlog and not
# a hole; `visibility` must outlast a write to the bucket.
writer:
  consumers: 3
  config:
    apiVersion: audit.truvity.github.io/audit-writer/v2
    secrets:
      source: file
      root: /etc/audit/secrets
    require: archived
    deployment: /etc/audit/deployment.yaml
    workloads: /etc/audit/workloads.yaml
    replicas: 3
    archive:
      bucket:
        name: audit-eu-example-1
        region: eu-west-1
      prefix: audit/app
      kmsKey: alias/audit-archive
    database:
      url: postgres://audit_writer@db.example.com:5432/audit?sslmode=verify-full
      passwordSecret: database-password
    consume:
      sqs:
        queueUrl: https://sqs.eu-west-1.amazonaws.com/ACCOUNT/audit.fifo
        region: eu-west-1
        fifo: true
        batch: 10
        visibility: 2m
    roll:
      interval: 30s
      maxRecords: 5000
  secretFiles:
    - name: database-password
      secretName: audit-db
      key: password

# The indexer: follows the archive by listing and writes the index the query
# service reads. A Deployment of its own, as a database role of its own
# (`migrate.config.observe`) and under its own ServiceAccount, because the
# writer holds neither the index nor this identity.
observe:
  enabled: true
  config:
    apiVersion: audit.truvity.github.io/audit-observe/v2
    secrets:
      source: file
      root: /etc/audit/secrets
    archive:
      bucket:
        name: audit-eu-example-1
        region: eu-west-1
      prefix: audit/app
    database:
      url: postgres://audit_observe@db.example.com:5432/audit?sslmode=verify-full
      passwordSecret: observe-database-password
    settle: 2m
  secretFiles:
    - name: observe-database-password
      secretName: audit-db-observe
      key: password

# The jobs record through the writer's front door, which is the receiver, so
# what it acknowledges is `queued`: say so, and the job refuses to start against
# a writer it was not told gives that.
jobs:
  # Shown on the stream example; off here so that this one stays to the point.
  verify:
    enabled: false
  purge:
    enabled: false
  clockSync:
    enabled: false
