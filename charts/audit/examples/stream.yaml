# A product's installation: a receiver in front, writers consuming behind, and
# the index as one more database in the product's existing Postgres.
#
# This is what an application's chart sets under the `audit:` key when it takes
# this chart as a dependency. Everything not named here has a default. Each
# `config:` block is the binary's own configuration, key for key
# (docs/reference/configuration.md); a secret is never in one.
mode: stream

profiles:
  security:
    presets: [security]
  billing:
    presets: [billing-nl]
externalIdentifiersAreOpaque: true

# Receivers scale with the application's request rate; they validate, publish
# and answer. Writers scale with the record rate, because they are the ones
# that touch S3 and Postgres.
replicas: 2

workloadIdentity:
  issuers:
    - url: https://oidc.example.com/id/CLUSTER
  workloads:
    - subject: system:serviceaccount:app:api
      source: app

migrate:
  enabled: true
  config:
    database:
      url: postgres://audit@db.example.com:5432/audit?sslmode=verify-full
      passwordEnv: AUDIT_DATABASE_PASSWORD
    reader: audit_query
  secretEnv:
    - name: AUDIT_DATABASE_PASSWORD
      secretName: audit-db
      key: password

# The receiver holds neither the bucket nor a key, so a compromised front door
# cannot reach the archive.
receiver:
  config:
    mode: receiver
    deployment: /etc/audit/deployment.yaml
    workloads: /etc/audit/workloads.yaml
    database:
      url: postgres://audit@db.example.com:5432/audit?sslmode=verify-full
      passwordEnv: AUDIT_DATABASE_PASSWORD
    stream:
      nats:
        url: nats://nats.app.svc:4222
        # The broker verifies who connects: the receiver and the writers
        # present a projected service-account token of the broker's audience,
        # and the broker's auth callout reviews it and maps this namespace to
        # the application's account.
        tokenFile: /var/run/audit/stream/token
      name: AUDIT
  secretEnv:
    - name: AUDIT_DATABASE_PASSWORD
      secretName: audit-db
      key: password
  tokens:
    - audience: nats
      mountPath: /var/run/audit/stream

writer:
  consumers: 3
  config:
    deployment: /etc/audit/deployment.yaml
    workloads: /etc/audit/workloads.yaml
    replicas: 3
    archive:
      bucket:
        name: audit-eu-example-1
        region: eu-example-1
      prefix: audit/app
      kmsKey: alias/audit-archive
    database:
      url: postgres://audit@db.example.com:5432/audit?sslmode=verify-full
      passwordEnv: AUDIT_DATABASE_PASSWORD
    stream:
      nats:
        url: nats://nats.app.svc:4222
        tokenFile: /var/run/audit/stream/token
      name: AUDIT
      consumer: audit-writer
      batch: 100
      # Must exceed roll.interval plus the longest a put can take, or the
      # stream offers records a writer is still gathering to a second writer.
      ackWait: 2m
    # How much a writer gathers from the stream before it writes, which is
    # what decides how many objects a day of records becomes.
    roll:
      interval: 30s
      maxRecords: 5000
  secretEnv:
    - name: AUDIT_DATABASE_PASSWORD
      secretName: audit-db
      key: password
  tokens:
    - audience: nats
      mountPath: /var/run/audit/stream

query:
  enabled: true
  replicas: 2
  grants:
    issuers:
      # The gateway in front of the console issues the token the page carries.
      - url: https://gateway.example.com
        audience: audit
  config:
    deployment: /etc/audit/deployment.yaml
    grants: /etc/audit/grants.yaml
    sink:
      url: http://audit:8080
      tokenFile: /var/run/audit/token
    database:
      url: postgres://audit_query@db.example.com:5432/audit?sslmode=verify-full
      passwordEnv: AUDIT_QUERY_DATABASE_PASSWORD
    archive:
      bucket:
        name: audit-eu-example-1
        region: eu-example-1
      prefix: audit/app
  secretEnv:
    - name: AUDIT_QUERY_DATABASE_PASSWORD
      secretName: audit-db-reader
      key: password
  tokens:
    - audience: audit
      mountPath: /var/run/audit

jobs:
  verify:
    enabled: true
    config:
      deployment: /etc/audit/deployment.yaml
      archive:
        bucket:
          name: audit-eu-example-1
          region: eu-example-1
        prefix: audit/app
      sink:
        url: http://audit:8080
        tokenFile: /var/run/audit/token
    tokens:
      - audience: audit
        mountPath: /var/run/audit
  purge:
    enabled: true
    config:
      deployment: /etc/audit/deployment.yaml
      database:
        url: postgres://audit@db.example.com:5432/audit?sslmode=verify-full
        passwordEnv: AUDIT_DATABASE_PASSWORD
    secretEnv:
      - name: AUDIT_DATABASE_PASSWORD
        secretName: audit-db
        key: password
  clockSync:
    enabled: true
    config:
      ntp: ["169.254.169.123"]
      sink:
        url: http://audit:8080
        tokenFile: /var/run/audit/token
    tokens:
      - audience: audit
        mountPath: /var/run/audit

# Both render nothing yet. They are here so that a deployment's values do not
# change when the work that fills them lands.
extensions:
  billing:
    enabled: false
  quotas:
    enabled: false
