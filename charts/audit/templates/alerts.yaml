{{- if eq .Values.renders "alerts" }}
{{- /*
Alert-only mode: this release renders the rules and nothing else, so it can be
installed a second time, where the metrics store's ruler looks for rule
objects, beside the release that runs the write path. The precedent is
truvity/openbao's openbao-ops chart (`format: vmrule`, `ruleLabels`).

The series are the ones the writer, the receiver and the emitters publish over
OTLP, named as the metrics gateway names them: dots become underscores, a
counter gains `_total`, a unit becomes a suffix. Only the cluster, namespace
and tier become labels from the resource, so every other label below
(`transport`, `durability`, `profile`) is a metric attribute. Nothing is
labelled by tenant: it is unbounded.

Two scopes. The writer's own series are selected by the namespace the write
path runs in (`alerts.namespace`, default this release's), because the
emitters' series carry THEIR namespace, and an application's drops must not be
hidden by a selector meant for the writer. Emitter series are selected by
`alerts.emitterNamespace` (a regex, default every namespace).

Every threshold carries its reason in a comment above the rule, and every
`by (...)` keeps the cluster label: one store holds many clusters and an
aggregation that drops it pairs series across them.
*/ -}}
{{- $a := .Values.alerts -}}
{{- $r := $a.rules -}}
{{- $ns := default .Release.Namespace $a.namespace -}}
{{- $c := $a.clusterLabel -}}
{{- $w := printf "namespace=%s" ($ns | toJson) -}}
{{- if $a.selector }}{{- $w = printf "%s,%s" $w $a.selector -}}{{- end -}}
{{- $e := printf "namespace=~%s" ($a.emitterNamespace | toJson) -}}
{{- if $a.emitterSelector }}{{- $e = printf "%s,%s" $e $a.emitterSelector -}}{{- end -}}
{{- if not (has $a.format (list "vmrule" "prometheusrule")) -}}
{{- fail (printf "audit: alerts.format is `vmrule` or `prometheusrule`, not %q." $a.format) -}}
{{- end -}}
{{- $name := default (printf "%s-alerts" (include "audit.fullname" .)) $a.name -}}
{{- $any := false -}}
{{- range $k, $v := $r }}{{- if $v.enabled }}{{- $any = true -}}{{- end }}{{- end -}}
{{- if not $any -}}
{{- fail "audit: alerts.rules has every rule disabled, so this release would render an empty rule group, which the rulers refuse. Enable one, or do not install in alerts mode." -}}
{{- end }}
apiVersion: {{ ternary "operator.victoriametrics.com/v1beta1" "monitoring.coreos.com/v1" (eq $a.format "vmrule") }}
kind: {{ ternary "VMRule" "PrometheusRule" (eq $a.format "vmrule") }}
metadata:
  name: {{ $name }}
  namespace: {{ default .Release.Namespace $a.objectNamespace }}
  labels:
    {{- include "audit.labels" . | nindent 4 }}
    app.kubernetes.io/component: alerts
    {{- with $a.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: audit.write-path
      interval: {{ $a.interval }}
      rules:
        {{- if $r.deadLettered.enabled }}
        # A record the writer could not process is kept aside and counted. There
        # is no healthy non-zero range: the writer accepts every well-formed
        # record, so each one is a record somebody sent that it could not read
        # (a catalogue it was never given, a schema it does not know) or a
        # fault in the writer. The window is 15m so one is seen however
        # slowly the metric is collected.
        - alert: AuditRecordsDeadLettered
          expr: >-
            sum by ({{ $c }}, namespace) (increase(audit_writer_dead_lettered_total{ {{- $w -}} }[15m])) > 0
          for: {{ $r.deadLettered.for }}
          labels:
            {{- include "audit.ruleLabels" (dict "root" $ "cfg" $r.deadLettered) | nindent 12 }}
          annotations:
            summary: 'The audit writer in {{ "{{ $labels.namespace }}" }} dead-lettered {{ "{{ $value | printf \"%.0f\" }}" }} record(s)'
            description: >-
              Records the writer could not process were kept aside in the
              archive's dead-letter prefix and counted. Each is a record a
              producer sent that is not in the trail in its proper form. Read the
              writer's log for the reason, then the dead-letter objects.
            {{- include "audit.runbook" (dict "root" $ "alert" "AuditRecordsDeadLettered") | nindent 12 }}
        {{- end }}
        {{- if $r.emitterDrops.enabled }}
        # An async emitter gives a record up only when its queue overflows, and
        # nothing else counts it. A record dropped never exists, so there is no
        # healthy non-zero range either. Selected in every application
        # namespace (`alerts.emitterNamespace`), not the writer's.
        - alert: AuditEmitterDroppingRecords
          expr: >-
            sum by ({{ $c }}, namespace) (increase(audit_emit_records_dropped_total{ {{- $e -}} }[15m])) > 0
          for: {{ $r.emitterDrops.for }}
          labels:
            {{- include "audit.ruleLabels" (dict "root" $ "cfg" $r.emitterDrops) | nindent 12 }}
          annotations:
            summary: 'An emitter in {{ "{{ $labels.namespace }}" }} dropped {{ "{{ $value | printf \"%.0f\" }}" }} audit record(s)'
            description: >-
              The application's async queue overflowed and gave records up. They
              are not in the trail and cannot be recovered from here. The sink was
              away longer than the queue is deep: see audit_emit_queue_pending for
              the climb, and the sink's own health.
            {{- include "audit.runbook" (dict "root" $ "alert" "AuditEmitterDroppingRecords") | nindent 12 }}
        {{- end }}
        {{- if $r.indexLag.enabled }}
        # The lag is from an object being put into the archive to its rows being
        # in the index, as audit-observe measures it. The indexer does not look at
        # an object younger than its settle window (default 2m), so that window is
        # the floor and a healthy p99 sits just above it, a little more than the
        # window plus a poll. The threshold is for an indexer that has stopped,
        # is starved or is stuck, and has to be raised with `settle`.
        - alert: AuditIndexLagHigh
          expr: >-
            histogram_quantile(0.99, sum by ({{ $c }}, namespace, profile, le) (rate(audit_observe_index_lag_seconds_bucket{ {{- $w -}} }[10m]))) > {{ $r.indexLag.thresholdSeconds }}
          for: {{ $r.indexLag.for }}
          labels:
            {{- include "audit.ruleLabels" (dict "root" $ "cfg" $r.indexLag) | nindent 12 }}
          annotations:
            summary: 'The audit index of profile {{ "{{ $labels.profile }}" }} is {{ "{{ $value | humanizeDuration }}" }} behind (p99)'
            description: >-
              Objects reach the index more than
              {{ $r.indexLag.thresholdSeconds }}s after they were put, at the 99th
              percentile. The archive is unaffected; search answers from an index
              that is behind. Look at whether audit-observe is running, at its log,
              and at the database's load.
            {{- include "audit.runbook" (dict "root" $ "alert" "AuditIndexLagHigh") | nindent 12 }}
        {{- end }}
        {{- if $r.indexDeferred.enabled }}
        # Objects the archive holds and the indexer could not index: a fetch or a
        # catalogue it will try again (reason=retry), or an object that does not
        # decode and has been skipped (reason=unreadable). Any is search that
        # answers wrongly or late, and nobody notices an index that is quietly
        # behind. Zero is the only healthy count.
        - alert: AuditIndexRowsDeferred
          expr: >-
            sum by ({{ $c }}, namespace, profile) (increase(audit_observe_index_deferred_total{ {{- $w -}} }[15m])) > 0
          for: {{ $r.indexDeferred.for }}
          labels:
            {{- include "audit.ruleLabels" (dict "root" $ "cfg" $r.indexDeferred) | nindent 12 }}
          annotations:
            summary: '{{ "{{ $value | printf \"%.0f\" }}" }} audit object(s) of profile {{ "{{ $labels.profile }}" }} are in the archive and not the index'
            description: >-
              The indexer could not index objects the archive holds. Its log names
              each. A retry resumes by itself once the cause (the bucket, a
              catalogue, the database) is fixed; an unreadable object is skipped and
              {{ "`audit reindex --profile <name> --from <day> --to <day>`" }} is
              how a range is read again.
            {{- include "audit.runbook" (dict "root" $ "alert" "AuditIndexRowsDeferred") | nindent 12 }}
        {{- end }}
        {{- if $r.writerRejections.enabled }}
        # The share of records refused for their own sake. A producer with a bug
        # is refused at a steady few percent of ITS traffic and the rest of the
        # installation is unaffected, so the threshold is on the share of the
        # whole and not on a count, with a floor of `minRecords` refusals in the
        # window so that one bad record in a quiet hour is not a page.
        - alert: AuditWriterRejectingRecords
          expr: >-
            (
              sum by ({{ $c }}, namespace) (increase(audit_sink_records_rejected_total{ {{- $w -}} }[15m]))
              /
              (
                sum by ({{ $c }}, namespace) (increase(audit_sink_records_rejected_total{ {{- $w -}} }[15m]))
                +
                sum by ({{ $c }}, namespace) (increase(audit_sink_records_acknowledged_total{ {{- $w -}} }[15m]))
              )
            ) > {{ $r.writerRejections.ratio }}
            and
            sum by ({{ $c }}, namespace) (increase(audit_sink_records_rejected_total{ {{- $w -}} }[15m])) >= {{ $r.writerRejections.minRecords }}
          for: {{ $r.writerRejections.for }}
          labels:
            {{- include "audit.ruleLabels" (dict "root" $ "cfg" $r.writerRejections) | nindent 12 }}
          annotations:
            summary: 'The audit writer in {{ "{{ $labels.namespace }}" }} is refusing {{ "{{ $value | humanizePercentage }}" }} of the records it is sent'
            description: >-
              More than {{ $r.writerRejections.ratio }} of the records sent in the
              last 15 minutes were refused as invalid. The refusals name the
              record and the reason in the writer's log. A producer is sending
              what its catalogue does not allow, or a catalogue changed under it.
            {{- include "audit.runbook" (dict "root" $ "alert" "AuditWriterRejectingRecords") | nindent 12 }}
        {{- end }}
        {{- if $r.consumerFailing.enabled }}
        # A consumer that fails once is a writer restarting or a broker
        # electing a leader, and the queue delivers the batch again. A failure
        # rate that is still above zero fifteen minutes later is not that: the
        # batches go round and none go through. `for` is the whole threshold.
        - alert: AuditQueueConsumerFailing
          expr: >-
            sum by ({{ $c }}, namespace, transport) (rate(audit_sink_consume_failures_total{ {{- $w -}},transport=~"nats|sqs"}[5m])) > 0
          for: {{ $r.consumerFailing.for }}
          labels:
            {{- include "audit.ruleLabels" (dict "root" $ "cfg" $r.consumerFailing) | nindent 12 }}
          annotations:
            summary: 'The audit {{ "{{ $labels.transport }}" }} consumer in {{ "{{ $labels.namespace }}" }} keeps failing its batches'
            description: >-
              The consumer's target refused or failed its batches for longer than
              {{ $r.consumerFailing.for }}. Records are accumulating on the queue
              and are delivered again. Read the writer's log for the refusal, and
              the queue's own backlog and age of the oldest message.
            {{- include "audit.runbook" (dict "root" $ "alert" "AuditQueueConsumerFailing") | nindent 12 }}
        {{- end }}
{{- end }}
