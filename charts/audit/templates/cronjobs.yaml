{{/*
A scheduled job: `audit <command> --config`, in the toolchain's image, with the
configuration of its own. Takes (dict "root" $ "name" "verify" "command"
"verify" "comp" <the job's values> "account" <service account> "profiles" bool).
`profiles` mounts the profile document, for a job whose config names it. A job
with an image of its own (the notary) passes "image" and no "command": the
image's one binary takes `--config`.
*/}}
{{- define "audit.cronjob" -}}
{{- $ := .root -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "audit.fullname" $ }}-{{ .name }}
  labels:
    {{- include "audit.labels" $ | nindent 4 }}
spec:
  schedule: {{ .comp.schedule | quote }}
  # A run that overlaps itself only does the same work twice.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "audit.selectorLabels" $ | nindent 12 }}
          annotations:
            checksum/config: {{ toYaml .comp.config | sha256sum }}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ .account }}
          {{- include "audit.podDefaults" $ | nindent 10 }}
          containers:
            - name: {{ .name }}
              image: {{ .image | default (include "audit.cliImage" $) }}
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              args:
                {{- with .command }}
                - {{ . }}
                {{- end }}
                - --config=/etc/audit/config.yaml
              {{- with include "audit.secretEnv" .comp }}
              env:
                {{- . | nindent 16 }}
              {{- end }}
              securityContext:
                {{- toYaml $.Values.securityContext | nindent 16 }}
              volumeMounts:
                {{- include "audit.configMount" $ | nindent 16 }}
                {{- if .profiles }}
                {{- include "audit.deploymentMount" $ | nindent 16 }}
                {{- end }}
                {{- include "audit.trustMount" $ | nindent 16 }}
                {{- include "audit.extraMounts" .comp | nindent 16 }}
          volumes:
            {{- include "audit.configVolume" (dict "root" $ "name" .name) | nindent 12 }}
            {{- if .profiles }}
            {{- include "audit.deploymentVolume" $ | nindent 12 }}
            {{- end }}
            {{- include "audit.trustVolume" $ | nindent 12 }}
            {{- include "audit.extraVolumes" .comp | nindent 12 }}
{{- end -}}
{{- if eq .Values.renders "app" -}}
{{- if .Values.jobs.notary.enabled }}
# Hourly. Seals the hours that have closed and settled since the last seal, for
# every profile and tenant, into the signed chain: one seal per hour, empty
# hours too, each naming the one before. It resumes past a missed run on its
# own, so a failed hour needs no operator, and a rerun of a sealed hour writes
# nothing. It signs, and it runs as an identity of its own that the writer's is
# not: whoever can write the archive and can also sign for it can choose what
# to sign.
{{ include "audit.configMap" (dict "root" . "name" "notary" "config" .Values.jobs.notary.config) }}
---
{{ include "audit.cronjob" (dict "root" . "name" "notary" "image" (include "audit.notaryImage" .) "comp" .Values.jobs.notary "account" (include "audit.notaryServiceAccountName" .) "profiles" false) }}
{{- end }}
{{- if .Values.jobs.verify.enabled }}
---
# Nightly. Checks each profile's record objects of the last day against the
# bucket contract (key, metadata, sha256, the hash of every record) and, with
# `seals.roots`, the seals too: their signatures against the pinned roots, the
# chain, each hour's count and root against its objects, and that no due seal is
# missing. It reports what it finds; a non-zero exit is the alert. It reads the
# archive and nothing else, which is what lets an auditor run the same command
# and get the same answer.
{{ include "audit.configMap" (dict "root" . "name" "verify" "config" .Values.jobs.verify.config) }}
---
{{ include "audit.cronjob" (dict "root" . "name" "verify" "command" "verify" "comp" .Values.jobs.verify "account" (include "audit.verifyServiceAccountName" .) "profiles" true) }}
{{- end }}
{{- if .Values.jobs.purge.enabled }}
---
# Daily. Brings the index and the deduplication table back within what the
# profiles allow. It never touches the archive: those objects are released by
# their object lock, which is what makes a retention a retention.
{{ include "audit.configMap" (dict "root" . "name" "purge" "config" .Values.jobs.purge.config) }}
---
{{ include "audit.cronjob" (dict "root" . "name" "purge" "command" "purge" "comp" .Values.jobs.purge "account" (include "audit.purgeServiceAccountName" .) "profiles" true) }}
{{- end }}
{{- if .Values.jobs.clockSync.enabled }}
---
# Daily. Compares this cluster's clock with UTC and records the answer, which is
# what ETSI EN 319 401 7.10 asks for. It never sets the clock. A drift beyond
# the tolerance fails the run, so the job going red is the alert.
{{ include "audit.configMap" (dict "root" . "name" "clock-sync" "config" .Values.jobs.clockSync.config) }}
---
{{ include "audit.cronjob" (dict "root" . "name" "clock-sync" "command" "clock-sync" "comp" .Values.jobs.clockSync "account" (include "audit.clockSyncServiceAccountName" .) "profiles" false) }}
{{- end }}{{ end }}
