{{- if and (include "audit.hasDatabase" .) .Values.database.migrate }}
# The index schema, applied before the writer rolls.
#
# A hook rather than something the writer does at start-up: several replicas
# migrating at once is a race, and a schema change to the index should be a step
# an operator can see happen. The writer refuses to start against a version it
# does not know, so this Job failing stops the release rather than producing a
# writer that will not run.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "audit.fullname" . }}-migrate
  labels:
    {{- include "audit.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "audit.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "audit.serviceAccountName" . }}
      {{- include "audit.podDefaults" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "audit.cliImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - migrate
            - --database=$(AUDIT_DATABASE)
            {{- with .Values.query.database.role }}
            - --reader={{ . }}
            {{- end }}
          env:
            {{- include "audit.databaseEnv" . | nindent 12 }}
            {{- include "audit.trustEnv" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.trust.configMap }}
          volumeMounts:
            {{- include "audit.trustMount" . | nindent 12 }}
          {{- end }}
      {{- if .Values.trust.configMap }}
      volumes:
        {{- include "audit.trustVolume" . | nindent 8 }}
      {{- end }}
{{- end }}
