{{- if .Values.networkPolicy.enabled }}
# The writer is the single trusted consumer of the stream and the only thing
# that puts to the bucket. Saying so here is what keeps a second writer from
# appearing quietly: a deployment that can run one anyway is a deployment whose
# digest chain has objects nobody accounted for.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "audit.fullname" . }}
  labels:
    {{- include "audit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "audit.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        # Nothing named: the jobs record themselves through the writer, so they
        # reach it, and nothing else does.
        - podSelector:
            matchLabels:
              {{- include "audit.selectorLabels" . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
