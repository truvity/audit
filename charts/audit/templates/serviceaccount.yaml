{{- if eq .Values.renders "app" -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "audit.serviceAccountName" . }}
  labels:
    {{- include "audit.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.query.enabled .Values.query.serviceAccount.create }}
---
# Reading is a different privilege from writing: this identity reads the
# archive and writes exports, and holds a key only to open sealed identifiers
# if it may resolve. Pod Identity, IRSA or an OpenBAO role binds here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "audit.queryServiceAccountName" . }}
  labels:
    {{- include "audit.labels" . | nindent 4 }}
  {{- with .Values.query.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.observe.enabled .Values.observe.serviceAccount.create }}
---
# The indexer reads the archive and writes the index. It holds the index's
# write credential, which the writer must not, and reads what the writer wrote
# without being able to write it: a different identity from either. Pod
# Identity or IRSA binds here, with get and list on the archive and nothing more.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "audit.observeServiceAccountName" . }}
  labels:
    {{- include "audit.labels" . | nindent 4 }}
  {{- with .Values.observe.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.jobs.notary.enabled .Values.jobs.notary.serviceAccount.create }}
---
# Sealing is a different privilege from writing: whoever can write the archive
# and can also sign for it can choose what to sign. This identity reads the
# records, puts seals and keys/roots.jwks, and uses the seal key; the writer's
# role has no use of that key, and this one has no write to records/.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "audit.notaryServiceAccountName" . }}
  labels:
    {{- include "audit.labels" . | nindent 4 }}
  {{- with .Values.jobs.notary.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.jobs.verify.enabled .Values.jobs.verify.serviceAccount.create }}
---
# Verification needs to read the archive and nothing else. An auditor running
# the same command must get the same answer, which is what makes the answer
# worth having.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "audit.verifyServiceAccountName" . }}
  labels:
    {{- include "audit.labels" . | nindent 4 }}
  {{- with .Values.jobs.verify.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and (eq .Values.mode "stream") .Values.receiver.serviceAccount.create }}
---
# The front door publishes and nothing more. It must not hold the archive's
# write identity: a receiver that shares the writer's service account would
# reach the bucket through whatever Pod Identity or IRSA role that binds.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "audit.receiverServiceAccountName" . }}
  labels:
    {{- include "audit.labels" . | nindent 4 }}
  {{- with .Values.receiver.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.jobs.purge.enabled .Values.jobs.purge.serviceAccount.create }}
---
# Purging deletes from the archive, a different privilege from appending to it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "audit.purgeServiceAccountName" . }}
  labels:
    {{- include "audit.labels" . | nindent 4 }}
  {{- with .Values.jobs.purge.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.jobs.clockSync.enabled .Values.jobs.clockSync.serviceAccount.create }}
---
# Clock sync only records what it measured through the writer's sink. It needs
# no cloud rights at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "audit.clockSyncServiceAccountName" . }}
  labels:
    {{- include "audit.labels" . | nindent 4 }}
  {{- with .Values.jobs.clockSync.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}{{ end }}
