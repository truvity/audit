{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "audit.serviceAccountName" . }}
  labels:
    {{- include "audit.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.query.enabled .Values.query.serviceAccount.create }}
---
# Reading is a different privilege from writing: this identity reads the
# archive and writes exports, and holds a key only to open sealed identifiers
# if it may resolve. Pod Identity, IRSA or an OpenBAO role binds here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "audit.queryServiceAccountName" . }}
  labels:
    {{- include "audit.labels" . | nindent 4 }}
  {{- with .Values.query.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.jobs.digest.enabled .Values.jobs.digest.serviceAccount.create }}
---
# Sealing is a different privilege from writing: whoever can write the archive
# and also sign a digest for it can choose what to sign. This identity holds the
# signing key; the writer's does not.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "audit.digestServiceAccountName" . }}
  labels:
    {{- include "audit.labels" . | nindent 4 }}
  {{- with .Values.jobs.digest.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.jobs.verify.enabled .Values.jobs.verify.serviceAccount.create }}
---
# Verification needs to read the archive and nothing else. An auditor running
# the same command with the same public key must get the same answer, which is
# what makes the answer worth having.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "audit.verifyServiceAccountName" . }}
  labels:
    {{- include "audit.labels" . | nindent 4 }}
  {{- with .Values.jobs.verify.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
