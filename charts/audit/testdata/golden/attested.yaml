---
# Source: audit/templates/cronjobs.yaml
# Hourly. Seals the windows since the last digest into the signed chain. It
# resumes past a missed run on its own, so a failed hour needs no operator: a
# gap in the chain cannot be told from a digest somebody removed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-digest
  labels:
    helm.sh/chart: audit-0.3.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "7 * * * *"
  # A run that overlaps itself only re-reads windows it will skip.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audit
            app.kubernetes.io/instance: audit
        spec:
          restartPolicy: OnFailure
          serviceAccountName: audit-digest
          
          securityContext:
            fsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: digest
              image: ghcr.io/truvity/audit/audit:0.3.0
              imagePullPolicy: IfNotPresent
              args:
                - digest
                - --deployment=/etc/audit/deployment.yaml
                - --key=/etc/audit/signing/key.pem
                - --sink=http://audit:8080
                - --instance=$(POD_NAME)
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: AUDIT_BUCKET
                  value: "audit-archive"
                - name: AUDIT_PREFIX
                  value: "audit/app"
                - name: AWS_REGION
                  value: "auto"
                # Only when set: an empty endpoint would be taken literally by the SDK
                # rather than falling back to the AWS default.
                - name: AUDIT_S3_ENDPOINT
                  value: "https://s3.example.test"
                - name: AUDIT_S3_PATH_STYLE
                  value: "true"
                - name: AUDIT_LOCK_MODE
                  value: "none"
              
              envFrom:
                - secretRef:
                    name: audit-store-credentials
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: deployment
                  mountPath: /etc/audit/deployment.yaml
                  subPath: deployment.yaml
                  readOnly: true
                - name: signing
                  mountPath: /etc/audit/signing
                  readOnly: true
          volumes:
            - name: deployment
              configMap:
                name: audit-deployment
            - name: signing
              secret:
                secretName: audit-signing-key

---
# Source: audit/templates/cronjobs.yaml
# Nightly, per profile. Walks the chain and reports what it finds; a non-zero
# exit is the alert. It takes the public half of the signing key only, which is
# what lets an auditor run the same command and get the same answer.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-verify-history
  labels:
    helm.sh/chart: audit-0.3.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "23 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audit
            app.kubernetes.io/instance: audit
        spec:
          restartPolicy: OnFailure
          serviceAccountName: audit-verify
          
          securityContext:
            fsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: verify
              image: ghcr.io/truvity/audit/audit:0.3.0
              imagePullPolicy: IfNotPresent
              args:
                - verify
                - --profile=history
                - --last=24h
                - --public-key=/etc/audit/public/public.pem
                # With the deployment the check knows what lock the profile
                # demands: an object with none is INVALID under a profile
                # that demands one, and `unlocked` under one that does not.
                - --deployment=/etc/audit/deployment.yaml
                - --sink=http://audit:8080
                - --instance=$(POD_NAME)
                - --record
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: AUDIT_BUCKET
                  value: "audit-archive"
                - name: AUDIT_PREFIX
                  value: "audit/app"
                - name: AWS_REGION
                  value: "auto"
                # Only when set: an empty endpoint would be taken literally by the SDK
                # rather than falling back to the AWS default.
                - name: AUDIT_S3_ENDPOINT
                  value: "https://s3.example.test"
                - name: AUDIT_S3_PATH_STYLE
                  value: "true"
                - name: AUDIT_LOCK_MODE
                  value: "none"
              
              envFrom:
                - secretRef:
                    name: audit-store-credentials
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: public
                  mountPath: /etc/audit/public
                  readOnly: true
                - name: deployment
                  mountPath: /etc/audit/deployment.yaml
                  subPath: deployment.yaml
                  readOnly: true
          volumes:
            - name: public
              secret:
                secretName: audit-signing-public
            - name: deployment
              configMap:
                name: audit-deployment

