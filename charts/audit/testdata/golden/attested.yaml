---
# Source: audit/templates/query.yaml
# The read path. It reads the index as a role that does not own the tables, so
# the tenant policies bind it; it reads the archive for provenance; it records
# every read through the writer before answering; and it holds the keys only
# if it may resolve.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-query
  labels:
    helm.sh/chart: audit-0.3.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.3.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: query
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audit
      app.kubernetes.io/instance: audit
      app.kubernetes.io/component: query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit
        app.kubernetes.io/instance: audit
        app.kubernetes.io/component: query
      annotations:
        checksum/grants: 9dc7463633c5c1fa2aa226620cb1577a4cdc9cf47bda4233c4f758980e8d4d42
        # A grant preset turns roles into profiles, so the profiles are part
        # of what a grant means.
        checksum/deployment: 776c6ef2d6419216af14159fb357e78f086792084d8b054d0f0eaefb4031a37c
    spec:
      serviceAccountName: audit-query
      
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: query
          image: ghcr.io/truvity/audit/audit-query:0.3.0
          imagePullPolicy: IfNotPresent
          args:
            - --searcher=s3scan
            - --grants=/etc/audit/grants.yaml
            - --deployment=/etc/audit/deployment.yaml
            - --sink=http://audit:8080
            - --listen=:8080
            - --exports=audit-exports
            - --export-expiry=168h
            - --export-link-valid=1h
            - --exports-endpoint=https://files.example.test
            - --exports-path-style
            - --version=0.3.0
          env:
            - name: AUDIT_BUCKET
              value: "audit-archive"
            - name: AUDIT_PREFIX
              value: "audit/app"
            - name: AWS_REGION
              value: "auto"
            # Only when set: an empty endpoint would be taken literally by the SDK
            # rather than falling back to the AWS default.
            - name: AUDIT_S3_ENDPOINT
              value: "https://s3.example.test"
            - name: AUDIT_S3_PATH_STYLE
              value: "true"
            - name: AUDIT_LOCK_MODE
              value: "none"
            
            # A second identity for the exports bucket, when the archive's
            # credentials do not reach it. Named variables rather than
            # envFrom: one process reads one AWS_ACCESS_KEY_ID, so the
            # exports' arrive under their own names.
            - name: AUDIT_EXPORTS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: audit-exports-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AUDIT_EXPORTS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: audit-exports-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AUDIT_EXPORTS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: audit-exports-credentials
                  key: AWS_SESSION_TOKEN
                  optional: true
          
          envFrom:
            - secretRef:
                name: audit-store-credentials
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            {}
          volumeMounts:
            - name: deployment
              mountPath: /etc/audit/deployment.yaml
              subPath: deployment.yaml
              readOnly: true
            - name: grants
              mountPath: /etc/audit/grants.yaml
              subPath: grants.yaml
              readOnly: true
            
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: deployment
          configMap:
            name: audit-deployment
        - name: grants
          configMap:
            name: audit-grants
        
        - name: tmp
          emptyDir: {}

