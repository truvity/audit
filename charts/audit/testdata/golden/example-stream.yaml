kind: CronJob
metadata:
  name: audit-verify-billing
  labels:
    helm.sh/chart: audit-0.2.6
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.2.6"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "23 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audit
            app.kubernetes.io/instance: audit
        spec:
          restartPolicy: OnFailure
          serviceAccountName: audit-verify
          
          securityContext:
            fsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: verify
              image: ghcr.io/truvity/audit/audit:0.2.6
              imagePullPolicy: IfNotPresent
              args:
                - verify
                - --profile=billing
                - --last=24h
                - --public-key=/etc/audit/public/public.pem
                - --sink=http://audit:8080
                - --instance=$(POD_NAME)
                - --record
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: AUDIT_BUCKET
                  value: "audit-eu-central-1"
                - name: AUDIT_PREFIX
                  value: "audit/app"
                - name: AWS_REGION
                  value: "eu-central-1"
                - name: AUDIT_TOKEN_FILE
                  value: /var/run/audit/token
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: public
                  mountPath: /etc/audit/public
                  readOnly: true
                - name: audit-token
                  mountPath: /var/run/audit
                  readOnly: true
          volumes:
            - name: public
              secret:
                secretName: audit-digest-public
            - name: audit-token
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      audience: "audit"
                      expirationSeconds: 3600

