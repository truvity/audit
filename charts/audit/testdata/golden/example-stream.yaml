---
# Source: audit/templates/query.yaml
# The read path. It reads the index as a role that does not own the tables, so
# the tenant policies bind it; it reads the archive for provenance; it records
# every read through the writer before answering; and it holds the keys only
# if it may resolve.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-query
  labels:
    helm.sh/chart: audit-0.2.6
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.2.6"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: query
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: audit
      app.kubernetes.io/instance: audit
      app.kubernetes.io/component: query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit
        app.kubernetes.io/instance: audit
        app.kubernetes.io/component: query
      annotations:
        checksum/grants: e03b3dce56c32adc0160430a0d5b208943ddf4cdcd353d3ae69cb9bf517ba9d3
        # A grant preset turns roles into profiles, so the profiles are part
        # of what a grant means.
        checksum/deployment: ec0b415169388bf2335b6196243c4e2c8160cb59a526ab34e0ee75ff7bc79516
    spec:
      serviceAccountName: audit-query
      
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: query
          image: ghcr.io/truvity/audit/audit-query:0.2.6
          imagePullPolicy: IfNotPresent
          args:
            - --searcher=postgres
            - --grants=/etc/audit/grants.yaml
            - --deployment=/etc/audit/deployment.yaml
            - --sink=http://audit:8080
            - --listen=:8080
            - --version=0.2.6
          env:
            - name: AUDIT_BUCKET
              value: "audit-eu-central-1"
            - name: AUDIT_PREFIX
              value: "audit/app"
            - name: AWS_REGION
              value: "eu-central-1"
            - name: AUDIT_DATABASE
              valueFrom:
                secretKeyRef:
                  name: audit-db-reader
                  key: url
            - name: AUDIT_TOKEN_FILE
              value: /var/run/audit/token
            
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            {}
          volumeMounts:
            - name: deployment
              mountPath: /etc/audit/deployment.yaml
              subPath: deployment.yaml
              readOnly: true
            - name: grants
              mountPath: /etc/audit/grants.yaml
              subPath: grants.yaml
              readOnly: true
            - name: audit-token
              mountPath: /var/run/audit
              readOnly: true
            
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: deployment
          configMap:
            name: audit-deployment
        - name: grants
          configMap:
            name: audit-grants
        - name: audit-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: "audit"
                  expirationSeconds: 3600
        
        - name: tmp
          emptyDir: {}

