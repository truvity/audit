  name: audit-purge
  labels:
    helm.sh/chart: audit-0.2.6
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.2.6"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "41 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audit
            app.kubernetes.io/instance: audit
        spec:
          restartPolicy: OnFailure
          serviceAccountName: audit
          
          securityContext:
            fsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: purge
              image: ghcr.io/truvity/audit/audit:0.2.6
              imagePullPolicy: IfNotPresent
              args:
                - purge
                - --deployment=/etc/audit/deployment.yaml
                - --database=$(AUDIT_DATABASE)
              env:
                
                - name: AUDIT_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: audit-db
                      key: url
                
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: deployment
                  mountPath: /etc/audit/deployment.yaml
                  subPath: deployment.yaml
                  readOnly: true
                
          volumes:
            - name: deployment
              configMap:
                name: audit-deployment
            

