---
# Source: audit/templates/cronjobs.yaml
# Hourly. Seals the windows since the last digest into the signed chain. It
# resumes past a missed run on its own, so a failed hour needs no operator: a
# gap in the chain cannot be told from a digest somebody removed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-digest
  labels:
    helm.sh/chart: audit-0.1.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "7 * * * *"
  # A run that overlaps itself only re-reads windows it will skip.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audit
            app.kubernetes.io/instance: audit
        spec:
          restartPolicy: OnFailure
          serviceAccountName: audit-digest
          
          securityContext:
            fsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: digest
              image: ghcr.io/truvity/audit/audit:0.1.0
              imagePullPolicy: IfNotPresent
              args:
                - digest
                - --deployment=/etc/audit/deployment.yaml
                - --key=/etc/audit/signing/key.pem
                - --key-id=audit-digest-2026
                - --sink=http://audit:8080
                - --instance=$(POD_NAME)
                - --lookback=168h
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: AUDIT_BUCKET
                  value: "audit-archive"
                - name: AUDIT_PREFIX
                  value: "prod"
                - name: AWS_REGION
                  value: "eu-central-1"
                - name: AUDIT_TOKEN_FILE
                  value: /var/run/audit/token
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: deployment
                  mountPath: /etc/audit/deployment.yaml
                  subPath: deployment.yaml
                  readOnly: true
                - name: signing
                  mountPath: /etc/audit/signing
                  readOnly: true
                - name: audit-token
                  mountPath: /var/run/audit
                  readOnly: true
          volumes:
            - name: deployment
              configMap:
                name: audit-deployment
            - name: signing
              secret:
                secretName: audit-signing-key
            - name: audit-token
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      audience: "audit"
                      expirationSeconds: 3600

