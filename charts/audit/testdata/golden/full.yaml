---
# Source: audit/templates/networkpolicy.yaml
# The writer is the single trusted consumer of the stream and the only thing
# that puts to the bucket. Saying so here is what keeps a second writer from
# appearing quietly: a deployment that can run one anyway is a deployment whose
# digest chain has objects nobody accounted for.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit
  labels:
    helm.sh/chart: audit-0.1.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: audit
      app.kubernetes.io/instance: audit
  policyTypes: [Ingress]
  ingress:
    - from:
        # Nothing named: the jobs record themselves through the writer, so they
        # reach it, and nothing else does.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: audit
              app.kubernetes.io/instance: audit
      ports:
        - protocol: TCP
          port: 8080

