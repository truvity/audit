# Source: audit/templates/cronjobs.yaml
# Daily. Brings the index and the deduplication table back within what the
# profiles allow. It never touches the archive: those objects are released by
# their object lock, which is what makes a retention a retention.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-purge
  labels:
    helm.sh/chart: audit-0.1.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "41 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audit
            app.kubernetes.io/instance: audit
        spec:
          restartPolicy: OnFailure
          serviceAccountName: audit
          
          securityContext:
            fsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: purge
              image: ghcr.io/truvity/audit/audit:0.1.0
              imagePullPolicy: IfNotPresent
              args:
                - purge
                - --deployment=/etc/audit/deployment.yaml
                - --database=$(AUDIT_DATABASE)
                - --dedupe-window=336h
              env:
                
                - name: AUDIT_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: audit-database
                      key: url
                
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: deployment
                  mountPath: /etc/audit/deployment.yaml
                  subPath: deployment.yaml
                  readOnly: true
                
          volumes:
            - name: deployment
              configMap:
                name: audit-deployment
            

---
# Source: audit/templates/cronjobs.yaml
# Daily. Compares this cluster's clock with UTC and records the answer, which is
# what ETSI EN 319 401 7.10 asks for. It never sets the clock. A drift beyond
# the tolerance fails the run, so the job going red is the alert.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-clock-sync
  labels:
    helm.sh/chart: audit-0.1.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "13 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audit
            app.kubernetes.io/instance: audit
        spec:
          restartPolicy: OnFailure
          serviceAccountName: audit
          
          securityContext:
            fsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: clock-sync
              image: ghcr.io/truvity/audit/audit:0.1.0
              imagePullPolicy: IfNotPresent
              args:
                - clock-sync
                - --ntp=time.cloudflare.com
                - --ntp=time.google.com
                - --sink=http://audit:8080
                - --max-offset=1s
                - --instance=$(POD_NAME)
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: AUDIT_TOKEN_FILE
                  value: /var/run/audit/token
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: audit-token
                  mountPath: /var/run/audit
                  readOnly: true
          volumes:
            - name: audit-token
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      audience: "audit"
                      expirationSeconds: 3600
---
# Source: audit/templates/migrate.yaml
# The index schema, applied before the writer rolls.
#
# A hook rather than something the writer does at start-up: several replicas
# migrating at once is a race, and a schema change to the index should be a step
# an operator can see happen. The writer refuses to start against a version it
# does not know, so this Job failing stops the release rather than producing a
# writer that will not run.
apiVersion: batch/v1
kind: Job
metadata:
  name: audit-migrate
  labels:
    helm.sh/chart: audit-0.1.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit
        app.kubernetes.io/instance: audit
    spec:
      restartPolicy: Never
      serviceAccountName: audit
      
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/truvity/audit/audit:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - migrate
            - --database=$(AUDIT_DATABASE)
            - --reader=audit_query
          env:
            
            - name: AUDIT_DATABASE
              valueFrom:
                secretKeyRef:
                  name: audit-database
                  key: url
            
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true

