# Source: audit/templates/writer.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit
  labels:
    helm.sh/chart: audit-0.1.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: audit
      app.kubernetes.io/instance: audit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit
        app.kubernetes.io/instance: audit
      annotations:
        # A profile change must reach a running writer, which only happens if
        # the pod is replaced.
        checksum/deployment: 4432a6b2c0ad0165d18cb5a15b6bf7efe83c34765786daad3f77e2c2c970f610
    spec:
      serviceAccountName: audit
      
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: writer
          image: ghcr.io/truvity/audit:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["audit-writer"]
          args:
            - --deployment=/etc/audit/deployment.yaml
            - --listen=:8080
            - --roll-interval=60s
            - --replicas=3
            - --kms-key=alias/audit
            - --key-root=/etc/audit/keys/root
            - --key-dir=/var/lib/audit/keys
            - --stream-url=nats://nats.audit.svc:4222
            - --stream=AUDIT
            - --consumer=audit-writer
            - --stream-batch=100
            - --stream-ack-wait=30s
            - --version=0.1.0
          env:
            - name: AUDIT_BUCKET
              value: "audit-archive"
            - name: AUDIT_PREFIX
              value: "prod"
            - name: AWS_REGION
              value: "eu-central-1"
            
            - name: AUDIT_DATABASE
              valueFrom:
                secretKeyRef:
                  name: audit-database
                  key: url
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            {}
          volumeMounts:
            - name: deployment
              mountPath: /etc/audit/deployment.yaml
              subPath: deployment.yaml
              readOnly: true
            - name: key-root
              mountPath: /etc/audit/keys
              readOnly: true
            - name: keys
              mountPath: /var/lib/audit/keys
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: deployment
          configMap:
            name: audit-deployment
        - name: key-root
          secret:
            secretName: audit-key-root
        - name: keys
          persistentVolumeClaim:
            claimName: audit-keys
        - name: tmp
          emptyDir: {}

---
# Source: audit/templates/cronjobs.yaml
# Hourly. Seals the windows since the last digest into the signed chain. It
# resumes past a missed run on its own, so a failed hour needs no operator: a
# gap in the chain cannot be told from a digest somebody removed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-digest
  labels:
    helm.sh/chart: audit-0.1.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "7 * * * *"
  # A run that overlaps itself only re-reads windows it will skip.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audit
            app.kubernetes.io/instance: audit
        spec:
          restartPolicy: OnFailure
          serviceAccountName: audit-digest
          
          securityContext:
            fsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: digest
              image: ghcr.io/truvity/audit:0.1.0
              imagePullPolicy: IfNotPresent
              command: ["audit", "digest"]
              args:
                - --deployment=/etc/audit/deployment.yaml
                - --key=/etc/audit/signing/key.pem
                - --key-id=audit-digest-2026
                - --sink=http://audit:8080
                - --instance=$(POD_NAME)
                - --lookback=168h
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: AUDIT_BUCKET
                  value: "audit-archive"
                - name: AUDIT_PREFIX
                  value: "prod"
                - name: AWS_REGION
                  value: "eu-central-1"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: deployment
                  mountPath: /etc/audit/deployment.yaml
                  subPath: deployment.yaml
                  readOnly: true
                - name: signing
                  mountPath: /etc/audit/signing
                  readOnly: true
          volumes:
            - name: deployment
              configMap:
                name: audit-deployment
            - name: signing
              secret:
                secretName: audit-signing-key

---
# Source: audit/templates/cronjobs.yaml
# Nightly, per profile. Walks the chain and reports what it finds; a non-zero
# exit is the alert. It takes the public half of the signing key only, which is
# what lets an auditor run the same command and get the same answer.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-verify-billing-nl
  labels:
    helm.sh/chart: audit-0.1.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "23 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audit
            app.kubernetes.io/instance: audit
        spec:
          restartPolicy: OnFailure
          serviceAccountName: audit-verify
          
          securityContext:
            fsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: verify
              image: ghcr.io/truvity/audit:0.1.0
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  exec audit verify \
                    --profile=billing-nl \
                    --from="$(date -u -d '-24h' +%Y-%m-%dT%H)" \
                    --to="$(date -u +%Y-%m-%dT%H)" \
                    --public-key=/etc/audit/public/public.pem \
                    --lookback=168h \
                    --sink=http://audit:8080 \
                    --instance="$POD_NAME"
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: AUDIT_BUCKET
                  value: "audit-archive"
                - name: AUDIT_PREFIX
                  value: "prod"
                - name: AWS_REGION
                  value: "eu-central-1"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: public
                  mountPath: /etc/audit/public
                  readOnly: true
          volumes:
            - name: public
              secret:
                secretName: audit-signing-public

