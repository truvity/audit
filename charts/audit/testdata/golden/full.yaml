# Source: audit/templates/query.yaml
# The read path. It reads the index as a role that does not own the tables, so
# the tenant policies bind it; it reads the archive for provenance; it records
# every read through the writer before answering; and it holds the keys only
# if it may resolve.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-query
  labels:
    helm.sh/chart: audit-0.1.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: query
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: audit
      app.kubernetes.io/instance: audit
      app.kubernetes.io/component: query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit
        app.kubernetes.io/instance: audit
        app.kubernetes.io/component: query
      annotations:
        checksum/grants: 64a2af7a257e3558f4c717cd5961046d26a7a78787c31965c503d3e1aa5589a9
        # A grant preset turns roles into profiles, so the profiles are part
        # of what a grant means.
        checksum/deployment: 4432a6b2c0ad0165d18cb5a15b6bf7efe83c34765786daad3f77e2c2c970f610
    spec:
      serviceAccountName: audit-query
      
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: query
          image: ghcr.io/truvity/audit/audit-query:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --searcher=postgres
            - --grants=/etc/audit/grants.yaml
            - --deployment=/etc/audit/deployment.yaml
            - --sink=http://audit:8080
            - --listen=:8080
            - --exports=audit-exports
            - --export-expiry=168h
            - --export-link-valid=1h
            - --key-provider=local
            - --key-root=/etc/audit/keys/root
            - --key-dir=/var/lib/audit/keys
            - --version=0.1.0
          env:
            - name: AUDIT_BUCKET
              value: "audit-archive"
            - name: AUDIT_PREFIX
              value: "prod"
            - name: AWS_REGION
              value: "eu-central-1"
            - name: AUDIT_DATABASE
              valueFrom:
                secretKeyRef:
                  name: audit-query-database
                  key: url
            - name: AUDIT_TOKEN_FILE
              value: /var/run/audit/token
            
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            {}
          volumeMounts:
            - name: deployment
              mountPath: /etc/audit/deployment.yaml
              subPath: deployment.yaml
              readOnly: true
            - name: grants
              mountPath: /etc/audit/grants.yaml
              subPath: grants.yaml
              readOnly: true
            - name: audit-token
              mountPath: /var/run/audit
              readOnly: true
            - name: key-root
              mountPath: /etc/audit/keys
              readOnly: true
            - name: keys
              mountPath: /var/lib/audit/keys
              readOnly: true
            
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: deployment
          configMap:
            name: audit-deployment
        - name: grants
          configMap:
            name: audit-grants
        - name: audit-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: "audit"
                  expirationSeconds: 3600
        - name: key-root
          secret:
            secretName: audit-key-root
        - name: keys
          persistentVolumeClaim:
            claimName: audit-keys
            readOnly: true
        
        - name: tmp
          emptyDir: {}

