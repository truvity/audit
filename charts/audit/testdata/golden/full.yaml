# Source: audit/templates/serviceaccount.yaml
# Verification needs to read the archive and nothing else. An auditor running
# the same command with the same public key must get the same answer, which is
# what makes the answer worth having.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-verify
  labels:
    helm.sh/chart: audit-0.1.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: audit/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-deployment
  labels:
    helm.sh/chart: audit-0.1.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
data:
  # What `audit-writer --deployment` reads: which presets each profile is
  # composed from, and where its copies land. The jobs read the same document,
  # because retention is a property of the profile and every one of them needs
  # to agree about it.
  deployment.yaml: |
    external_identifiers_are_opaque: false
    profiles:
      billing-nl:
        presets:
        - billing-nl
      history:
        presets:
        - history
      security:
        presets:
        - security
  # What `audit-writer --workloads` reads: the
  # issuers trusted to name a calling workload, and the source each speaks for.
  workloads.yaml: |
    issuers:
      - url: "https://oidc.example.com/id/CLUSTER"
        audience: "audit"
    workloads:
      - networkPolicy: null
        subject: system:serviceaccount:wallet:wallet-api

---
# Source: audit/templates/query.yaml
# Who may sign in to the query service, and what each caller may read. A
# changed file must reach a running service, so the pods carry its checksum.
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-grants
  labels:
    helm.sh/chart: audit-0.1.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: query
data:
  grants.yaml: |
    issuers:
    - audience: audit
      url: https://id.example.com
    presets:
    - issuer: https://id.example.com
      name: access-roster

