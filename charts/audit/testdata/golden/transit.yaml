---
# Source: audit/templates/query.yaml
# The read path. It reads the index as a role that does not own the tables, so
# the tenant policies bind it; it reads the archive for provenance; it records
# every read through the writer before answering; and it holds the keys only
# if it may resolve.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-query
  labels:
    helm.sh/chart: audit-0.2.6
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.2.6"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: query
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: audit
      app.kubernetes.io/instance: audit
      app.kubernetes.io/component: query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit
        app.kubernetes.io/instance: audit
        app.kubernetes.io/component: query
      annotations:
        checksum/grants: c6e926709c6176bc66b906eaad228b9bb32e6760036c8733b2758355055342a1
        # A grant preset turns roles into profiles, so the profiles are part
        # of what a grant means.
        checksum/deployment: 5eacd6a942679dbcd129e785ee9432ef5945af9138235dadaf95cbcd5e92b58b
    spec:
      serviceAccountName: audit-query
      
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: query
          image: ghcr.io/truvity/audit/audit-query:0.2.6
          imagePullPolicy: IfNotPresent
          args:
            - --searcher=postgres
            - --grants=/etc/audit/grants.yaml
            - --deployment=/etc/audit/deployment.yaml
            - --sink=http://audit:8080
            - --listen=:8080
            - --key-provider=transit
            - --transit-prefix=audit
            - --transit-address=https://openbao.example:8200
            - --transit-mount=transit
            - --transit-namespace=devel
            - --transit-ca-file=/etc/audit/trust/ca.crt
            - --transit-auth-mount=jwt-devel
            - --transit-auth-role=audit-resolve
            - --transit-jwt-file=/var/run/openbao/token
            - --version=0.2.6
          env:
            - name: AUDIT_BUCKET
              value: "audit-archive"
            - name: AUDIT_DATABASE
              valueFrom:
                secretKeyRef:
                  name: audit-query-database
                  key: url
            
            - name: PGSSLROOTCERT
              value: /etc/audit/trust/ca.crt
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            {}
          volumeMounts:
            - name: deployment
              mountPath: /etc/audit/deployment.yaml
              subPath: deployment.yaml
              readOnly: true
            - name: grants
              mountPath: /etc/audit/grants.yaml
              subPath: grants.yaml
              readOnly: true
            
            - name: openbao-token
              mountPath: /var/run/openbao
              readOnly: true
            
            - name: trust
              mountPath: /etc/audit/trust
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: deployment
          configMap:
            name: audit-deployment
        - name: grants
          configMap:
            name: audit-grants
        
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: "openbao"
                  expirationSeconds: 600
        
        - name: trust
          configMap:
            name: private-ca-bundle
        - name: tmp
          emptyDir: {}

