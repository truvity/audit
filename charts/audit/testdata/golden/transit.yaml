---
# Source: audit/templates/cronjobs.yaml
# Hourly. Seals the windows since the last digest into the signed chain. It
# resumes past a missed run on its own, so a failed hour needs no operator: a
# gap in the chain cannot be told from a digest somebody removed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-digest
  labels:
    helm.sh/chart: audit-0.2.6
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.2.6"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "7 * * * *"
  # A run that overlaps itself only re-reads windows it will skip.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audit
            app.kubernetes.io/instance: audit
        spec:
          restartPolicy: OnFailure
          serviceAccountName: audit-digest
          
          securityContext:
            fsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: digest
              image: ghcr.io/truvity/audit/audit:0.2.6
              imagePullPolicy: IfNotPresent
              args:
                - digest
                - --deployment=/etc/audit/deployment.yaml
                - --transit-key=audit-digest
                - --transit-address=https://openbao.example:8200
                - --transit-mount=transit
                - --transit-namespace=devel
                - --transit-ca-file=/etc/audit/trust/ca.crt
                - --transit-auth-mount=jwt-devel
                - --transit-auth-role=audit-digest
                - --transit-jwt-file=/var/run/openbao/token
                - --sink=http://audit:8080
                - --instance=$(POD_NAME)
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: AUDIT_BUCKET
                  value: "audit-archive"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: deployment
                  mountPath: /etc/audit/deployment.yaml
                  subPath: deployment.yaml
                  readOnly: true
                
                - name: openbao-token
                  mountPath: /var/run/openbao
                  readOnly: true
                
                - name: trust
                  mountPath: /etc/audit/trust
                  readOnly: true
          volumes:
            - name: deployment
              configMap:
                name: audit-deployment
            
            - name: openbao-token
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      audience: "openbao"
                      expirationSeconds: 600
            
            - name: trust
              configMap:
                name: private-ca-bundle

---
# Source: audit/templates/cronjobs.yaml
# Nightly, per profile. Walks the chain and reports what it finds; a non-zero
# exit is the alert. It takes the public half of the signing key only, which is
# what lets an auditor run the same command and get the same answer.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-verify-security
  labels:
    helm.sh/chart: audit-0.2.6
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.2.6"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "23 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audit
            app.kubernetes.io/instance: audit
        spec:
          restartPolicy: OnFailure
          serviceAccountName: audit-verify
          
          securityContext:
            fsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: verify
              image: ghcr.io/truvity/audit/audit:0.2.6
              imagePullPolicy: IfNotPresent
              args:
                - verify
                - --profile=security
                - --last=24h
                - --public-key=/etc/audit/public/public.pem
                - --sink=http://audit:8080
                - --instance=$(POD_NAME)
                - --record
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: AUDIT_BUCKET
                  value: "audit-archive"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: public
                  mountPath: /etc/audit/public
                  readOnly: true
          volumes:
            - name: public
              secret:
                secretName: audit-signing-public

---
# Source: audit/templates/cronjobs.yaml
# Daily. Compares this cluster's clock with UTC and records the answer, which is
# what ETSI EN 319 401 7.10 asks for. It never sets the clock. A drift beyond
# the tolerance fails the run, so the job going red is the alert.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-clock-sync
  labels:
    helm.sh/chart: audit-0.2.6
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.2.6"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "13 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audit
            app.kubernetes.io/instance: audit
        spec:
          restartPolicy: OnFailure
          serviceAccountName: audit
          
          securityContext:
            fsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: clock-sync
              image: ghcr.io/truvity/audit/audit:0.2.6
              imagePullPolicy: IfNotPresent
              args:
                - clock-sync
                - --ntp=time.cloudflare.com
                - --sink=http://audit:8080
                - --max-offset=1s
                - --instance=$(POD_NAME)
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
---
# Source: audit/templates/migrate.yaml
# The identity this Job runs as, created as a hook of its own so that it
# exists before the Job that names it. A pre-install hook runs BEFORE the
# release's ordinary resources, so a hook Pod cannot name a ServiceAccount
# the release has not created yet: the Job would be admitted and then never
# get a Pod, with "serviceaccount not found" on the Job and a release that
# waits for a hook that can never run.
#
# It is the migration's own, not the writer's, and it carries no cloud
# annotations. This Job reads a database URL from a Secret and talks to
# Postgres; it has no business holding the credentials that write the
# archive. A lower weight than the Job so it is applied first.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-migrate
  labels:
    helm.sh/chart: audit-0.2.6
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.2.6"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"

---
# Source: audit/templates/migrate.yaml
# The index schema, applied before the writer rolls.
#
# A hook rather than something the writer does at start-up: several replicas
# migrating at once is a race, and a schema change to the index should be a step
# an operator can see happen. The writer refuses to start against a version it
# does not know, so this Job failing stops the release rather than producing a
# writer that will not run.
apiVersion: batch/v1
kind: Job
metadata:
  name: audit-migrate
  labels:
    helm.sh/chart: audit-0.2.6
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.2.6"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit
        app.kubernetes.io/instance: audit
    spec:
      restartPolicy: Never
      serviceAccountName: audit-migrate
      
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/truvity/audit/audit:0.2.6
          imagePullPolicy: IfNotPresent
          args:
            - migrate
            - --database=$(AUDIT_DATABASE)
          env:
            
            - name: AUDIT_DATABASE
              valueFrom:
                secretKeyRef:
                  name: audit-database
                  key: url
            
            - name: PGSSLROOTCERT
              value: /etc/audit/trust/ca.crt
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            
            - name: trust
              mountPath: /etc/audit/trust
              readOnly: true
      volumes:
        
        - name: trust
          configMap:
            name: private-ca-bundle

