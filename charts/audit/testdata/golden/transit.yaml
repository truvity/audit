# Source: audit/templates/serviceaccount.yaml
# Sealing is a different privilege from writing: whoever can write the archive
# and also sign a digest for it can choose what to sign. This identity holds the
# signing key; the writer's does not.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-digest
  labels:
    helm.sh/chart: audit-0.1.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: audit/templates/serviceaccount.yaml
# Verification needs to read the archive and nothing else. An auditor running
# the same command with the same public key must get the same answer, which is
# what makes the answer worth having.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-verify
  labels:
    helm.sh/chart: audit-0.1.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: audit/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-deployment
  labels:
    helm.sh/chart: audit-0.1.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
data:
  # What `audit-writer --deployment` reads: which presets each profile is
  # composed from, and where its copies land. The jobs read the same document,
  # because retention is a property of the profile and every one of them needs
  # to agree about it.
  deployment.yaml: |
    profiles:
      history:
        presets:
        - history
      security:
        presets:
        - security

