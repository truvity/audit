---
# Source: audit/templates/writer.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit
  labels:
    helm.sh/chart: audit-0.1.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: audit
      app.kubernetes.io/instance: audit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit
        app.kubernetes.io/instance: audit
      annotations:
        # A profile change must reach a running writer, which only happens if
        # the pod is replaced.
        checksum/deployment: 776c6ef2d6419216af14159fb357e78f086792084d8b054d0f0eaefb4031a37c
        # Likewise who may write: a changed issuer or mapping must reach it.
        checksum/workloads: b84b4ff82948eb0bf63ac4428d4927f43364293575e1ef8b0626ac8f68afa11f
    spec:
      serviceAccountName: audit
      
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: writer
          image: ghcr.io/truvity/audit-writer:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --deployment=/etc/audit/deployment.yaml
            - --listen=:8080
            - --roll-interval=60s
            - --replicas=3
            - --anonymous-writes
            - --key-provider=transit
            - --transit-address=https://openbao.example:8200
            - --transit-mount=transit
            - --transit-prefix=audit
            - --transit-token-file=/etc/audit/transit/token
            - --version=0.1.0
          env:
            - name: AUDIT_BUCKET
              value: "audit-archive"
            
            - name: AUDIT_DATABASE
              valueFrom:
                secretKeyRef:
                  name: audit-database
                  key: url
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            {}
          volumeMounts:
            - name: deployment
              mountPath: /etc/audit/deployment.yaml
              subPath: deployment.yaml
              readOnly: true
            - name: transit-token
              mountPath: /etc/audit/transit
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: deployment
          configMap:
            name: audit-deployment
        - name: transit-token
          secret:
            secretName: audit-writer-transit
        - name: tmp
          emptyDir: {}

---
# Source: audit/templates/cronjobs.yaml
# Hourly. Seals the windows since the last digest into the signed chain. It
# resumes past a missed run on its own, so a failed hour needs no operator: a
# gap in the chain cannot be told from a digest somebody removed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-digest
  labels:
    helm.sh/chart: audit-0.1.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "7 * * * *"
  # A run that overlaps itself only re-reads windows it will skip.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audit
            app.kubernetes.io/instance: audit
        spec:
          restartPolicy: OnFailure
          serviceAccountName: audit-digest
          
          securityContext:
            fsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: digest
              image: ghcr.io/truvity/audit:0.1.0
              imagePullPolicy: IfNotPresent
              args:
                - digest
                - --deployment=/etc/audit/deployment.yaml
                - --key=/etc/audit/signing/key.pem
                - --sink=http://audit:8080
                - --instance=$(POD_NAME)
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: AUDIT_BUCKET
                  value: "audit-archive"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: deployment
                  mountPath: /etc/audit/deployment.yaml
                  subPath: deployment.yaml
                  readOnly: true
                - name: signing
                  mountPath: /etc/audit/signing
                  readOnly: true
          volumes:
            - name: deployment
              configMap:
                name: audit-deployment
            - name: signing
              secret:
                secretName: audit-signing-key

---
# Source: audit/templates/cronjobs.yaml
# Nightly, per profile. Walks the chain and reports what it finds; a non-zero
# exit is the alert. It takes the public half of the signing key only, which is
# what lets an auditor run the same command and get the same answer.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-verify-history
  labels:
    helm.sh/chart: audit-0.1.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "23 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audit
            app.kubernetes.io/instance: audit
        spec:
          restartPolicy: OnFailure
          serviceAccountName: audit-verify
          
          securityContext:
            fsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: verify
              image: ghcr.io/truvity/audit:0.1.0
              imagePullPolicy: IfNotPresent
              args:
                - verify
                - --profile=history
                - --last=24h
                - --public-key=/etc/audit/public/public.pem
                - --sink=http://audit:8080
                - --instance=$(POD_NAME)
                - --record
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: AUDIT_BUCKET
                  value: "audit-archive"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: public
                  mountPath: /etc/audit/public
                  readOnly: true
          volumes:
            - name: public
              secret:
                secretName: audit-signing-public

