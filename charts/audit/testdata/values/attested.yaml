# The attested tier on an S3-compatible store that is not AWS: no Object
# Lock, so the signed digest chain under a managed key is the integrity
# control; an endpoint and path-style addressing; static credentials, since
# the store has no pod identity; and the query service with an exports bucket
# on a store of its own. The profile composes only presets whose frameworks
# do not demand the lock, or the writer would refuse to start.
mode: direct
externalIdentifiersAreOpaque: true
profiles:
  security:
    presets: [security]
  history:
    presets: [history]
writer:
  config:
    deployment: /etc/audit/deployment.yaml
    anonymousWrites: true
    archive:
      bucket:
        name: audit-archive
        region: auto
        endpoint: https://s3.example.test
        pathStyle: true
        credentialsEnv:
          accessKeyID: AUDIT_S3_ACCESS_KEY_ID
          secretAccessKey: AUDIT_S3_SECRET_ACCESS_KEY
      prefix: audit/app
      lockMode: none
  secretEnv:
    - name: AUDIT_S3_ACCESS_KEY_ID
      secretName: audit-store-credentials
      key: AWS_ACCESS_KEY_ID
    - name: AUDIT_S3_SECRET_ACCESS_KEY
      secretName: audit-store-credentials
      key: AWS_SECRET_ACCESS_KEY
query:
  enabled: true
  replicas: 1
  grants:
    issuers:
      - url: https://id.example.test
        audience: audit
  config:
    searcher: s3scan
    deployment: /etc/audit/deployment.yaml
    grants: /etc/audit/grants.yaml
    sink:
      url: http://audit:8080
    archive:
      bucket:
        name: audit-archive
        region: auto
        endpoint: https://s3.example.test
        pathStyle: true
        credentialsEnv:
          accessKeyID: AUDIT_S3_ACCESS_KEY_ID
          secretAccessKey: AUDIT_S3_SECRET_ACCESS_KEY
      prefix: audit/app
    exports:
      bucket:
        name: audit-exports
        endpoint: https://files.example.test
        pathStyle: true
        credentialsEnv:
          accessKeyID: AUDIT_EXPORTS_ACCESS_KEY_ID
          secretAccessKey: AUDIT_EXPORTS_SECRET_ACCESS_KEY
  secretEnv:
    - name: AUDIT_S3_ACCESS_KEY_ID
      secretName: audit-store-credentials
      key: AWS_ACCESS_KEY_ID
    - name: AUDIT_S3_SECRET_ACCESS_KEY
      secretName: audit-store-credentials
      key: AWS_SECRET_ACCESS_KEY
    - name: AUDIT_EXPORTS_ACCESS_KEY_ID
      secretName: audit-exports-credentials
      key: AWS_ACCESS_KEY_ID
    - name: AUDIT_EXPORTS_SECRET_ACCESS_KEY
      secretName: audit-exports-credentials
      key: AWS_SECRET_ACCESS_KEY
jobs:
  digest:
    config:
      deployment: /etc/audit/deployment.yaml
      archive:
        bucket:
          name: audit-archive
          region: auto
          endpoint: https://s3.example.test
          pathStyle: true
          credentialsEnv:
            accessKeyID: AUDIT_S3_ACCESS_KEY_ID
            secretAccessKey: AUDIT_S3_SECRET_ACCESS_KEY
        prefix: audit/app
        lockMode: none
      sink:
        url: http://audit:8080
      signer:
        keyFile:
          path: /etc/audit/signing/key.pem
    secretMounts:
      - secretName: audit-signing-key
        mountPath: /etc/audit/signing
    secretEnv:
      - name: AUDIT_S3_ACCESS_KEY_ID
        secretName: audit-store-credentials
        key: AWS_ACCESS_KEY_ID
      - name: AUDIT_S3_SECRET_ACCESS_KEY
        secretName: audit-store-credentials
        key: AWS_SECRET_ACCESS_KEY
  verify:
    config:
      deployment: /etc/audit/deployment.yaml
      archive:
        bucket:
          name: audit-archive
          region: auto
          endpoint: https://s3.example.test
          pathStyle: true
          credentialsEnv:
            accessKeyID: AUDIT_S3_ACCESS_KEY_ID
            secretAccessKey: AUDIT_S3_SECRET_ACCESS_KEY
        prefix: audit/app
        lockMode: none
      publicKeyFile: /etc/audit/public/public.pem
    secretMounts:
      - secretName: audit-signing-public
        mountPath: /etc/audit/public
    secretEnv:
      - name: AUDIT_S3_ACCESS_KEY_ID
        secretName: audit-store-credentials
        key: AWS_ACCESS_KEY_ID
      - name: AUDIT_S3_SECRET_ACCESS_KEY
        secretName: audit-store-credentials
        key: AWS_SECRET_ACCESS_KEY
  purge:
    enabled: false
  clockSync:
    config:
      ntp: [time.example.test]
