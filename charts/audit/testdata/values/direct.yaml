# Direct mode: the front door and the write path in one process, no stream, one
# writer, and the jobs that need no database. A trial install, so the writer
# takes writes from callers it cannot verify.
mode: direct
externalIdentifiersAreOpaque: true
writer:
  config:
    deployment: /etc/audit/deployment.yaml
    anonymousWrites: true
    archive:
      bucket:
        name: audit-archive
jobs:
  digest:
    config:
      deployment: /etc/audit/deployment.yaml
      archive:
        bucket:
          name: audit-archive
      sink:
        url: http://audit:8080
      signer:
        keyFile:
          path: /etc/audit/signing/key.pem
    secretMounts:
      - secretName: audit-signing-key
        mountPath: /etc/audit/signing
  verify:
    config:
      deployment: /etc/audit/deployment.yaml
      archive:
        bucket:
          name: audit-archive
      sink:
        url: http://audit:8080
      publicKeyFile: /etc/audit/public/public.pem
    secretMounts:
      - secretName: audit-signing-public
        mountPath: /etc/audit/public
  purge:
    enabled: false
  clockSync:
    config:
      ntp: [time.cloudflare.com]
      sink:
        url: http://audit:8080
