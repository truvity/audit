# A valid install whose writer holds its keys in OpenBAO: the base the refusals
# about separation of duties are laid over (tests/invalid/audit).
mode: direct
externalIdentifiersAreOpaque: true
writer:
  config:
    deployment: /etc/audit/deployment.yaml
    anonymousWrites: true
    archive:
      bucket:
        name: audit-archive
    keys:
      provider: transit
      transit:
        openbao:
          address: https://openbao.example.test:8200
          login:
            mount: jwt-devel
            role: audit-writer
            jwtFile: /var/run/openbao/token
jobs:
  notary:
    enabled: false
  verify:
    enabled: false
  purge:
    enabled: false
  clockSync:
    enabled: false
