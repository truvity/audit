# The audit write path. Names follow docs/reference/configuration.md.

image:
  # One image per binary, as ko builds them: the writer runs in the
  # Deployment, the toolchain in the jobs. Both are distroless and have no
  # shell, which is why every job below is a command with arguments.
  writer:
    repository: ghcr.io/truvity/audit/audit-writer
    tag: ""        # defaults to the chart's appVersion
  cli:
    repository: ghcr.io/truvity/audit/audit
    tag: ""
  query:
    repository: ghcr.io/truvity/audit/audit-query
    tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# The writers that consume the stream, in `mode: stream`. They scale with the
# record rate; the receivers above scale with the application's request rate.
writer:
  consumers: 3

# How many front-door pods there are. More than one needs a shared deduplication
# table (`database`) and a key provider every replica sees the same keys
# through; the chart refuses to render otherwise, because the binary refuses to
# start and a manifest it will reject is worse than an error here.
replicas: 1

# How the write path is arranged.
#
#   direct  one Deployment: the front door and the write path in one process.
#           It serves the sink, puts every batch it takes before it answers,
#           and needs no stream. For an internal service, or any cluster
#           without one.
#   stream  two: a receiver that serves the sink and publishes to JetStream,
#           holding neither the bucket nor a key, and `writer.consumers`
#           writers that read the stream and put the objects. For a product.
#
# The application is configured the same way either side of the choice: the
# Service keeps its name and the receiver keeps the `writer` component label,
# because it is the address records are written to and that should not move
# when a deployment changes shape.
mode: direct

# The archive.
bucket: ""
prefix: ""
region: ""
kmsKey: ""
# Governance mode lets a privileged role shorten a retention. It is off, and a
# deployment that turns it on should be able to say why in writing.
governance: false

# The profiles this deployment keeps, as `audit-writer --deployment` reads them.
# Each is composed from the presets the library ships.
# Adding a profile here is additive: Helm merges maps, so a values file that
# names one profile gets this one as well. Name every profile the installation
# should keep.
#
# `security` is composed everywhere; see docs/operations/presets-policy.md for
# which of the others a deployment should compose, and what each costs.
profiles:
  security:
    presets: [security]

# The query service: search, facets, get, export, tail and resolve, behind the
# grants below. Every read it serves is recorded through the writer.
query:
  enabled: false
  replicas: 2
  service:
    port: 8080
  # postgres answers from the index; s3scan reads the archive within a budget,
  # for a deployment with no database.
  searcher: postgres
  # The query service's own database role, required with the postgres
  # searcher. Tenant row-level security binds only a role that does not own
  # the tables, so this must NOT be the writer's URL: create a role with usage
  # on the schema and select on its tables, and nothing else. The chart
  # refuses the writer's Secret or URL here, because an owner bypasses every
  # policy and tenant isolation would rest on the service alone.
  database:
    url: ""
    existingSecret: ""
    secretKey: url
    # The role that URL connects as. When set, the migration job grants it
    # usage on the schema and select on every table, now and later, and
    # nothing else: the grants the deploy guide otherwise asks for by hand.
    # The role itself must already exist; the chart creates no roles.
    role: ""
  # The grants file: the issuers trusted to sign callers in, presets, and
  # rules. See docs/guides/read.md#access. Without an issuer nobody can sign
  # in, and the service refuses to start.
  grants: {}
  #  issuers:
  #    - url: https://id.example.com
  #      audience: audit
  #  presets:
  #    - name: access-roster
  #      issuer: https://id.example.com
  # Exports go to a separate bucket with no Object Lock, which clears them.
  # Empty refuses the export operation.
  exports:
    bucket: ""
    expiry: 168h
    linkValid: 1h
  # Resolving a pseudonym back to a person. Off unless this service is to do
  # it: a query service without the keys cannot undo a pseudonym whatever a
  # grant says. It uses the writer's key provider (`keys.provider`):
  #  - local: mounts the writer's key root and directory read-only, so the
  #    directory must be ReadWriteMany;
  #  - transit: its own token, whose policy grants decrypt on the purposes it
  #    resolves and nothing else (docs/operations/openbao-keys.md).
  resolve:
    enabled: false
    # With transit: how the query service signs in, one of three, never the
    # writer's — its policy grants decrypt and nothing else.
    transit:
      role: ""
      token:
        existingSecret: ""
        secretKey: token
      tokenFile: ""
  # Its own identity: read on the archive, write on the exports bucket, and —
  # with transit — decrypt. None of the writer's rights.
  serviceAccount:
    create: true
    annotations: {}

# Who is calling the writer.
#
# A workload presents its projected service-account token, and the writer
# verifies it against the cluster's own OIDC issuer. The subject is the service
# account, which the kubelet vouches for and the workload cannot choose. The
# writer stamps it on every record as the observer, and the mapping below is
# how it decides whose catalogue a registration is. The jobs present their own
# tokens the same way.
workloadIdentity:
  # The issuers trusted to name a workload, exactly as their tokens' iss claim
  # reads — on EKS, the cluster's OIDC provider URL. Discovery is fetched from
  # each at start-up, so it must be reachable from the pods over HTTPS.
  issuers: []
  #  - url: https://oidc.example.com/id/CLUSTER
  # The audience the jobs request on their tokens and the services require.
  # An issuer entry may name its own.
  audience: audit
  # How long a projected token lives. The kubelet replaces it before then, and
  # the jobs read it afresh on every request.
  expirationSeconds: 3600
  # Which service account speaks for which source. The writer accepts a
  # catalogue at start-up (RegisterCatalogue, beside the sink — there is no
  # registry service), and takes whose it is from here and never from the
  # document. A workload not listed cannot register a catalogue at all, which
  # is why an installation that keeps an index and verifies callers must fill
  # this in.
  workloads: []
  #  - subject: system:serviceaccount:wallet:wallet-api
  #    source: wallet

# Accept writes over HTTP from callers nobody verified, stamped with no
# observer. For a trial install only: anyone who can reach the writer's port
# can then write records, and nothing says who did.
anonymousWrites: false

# What a product switches on in its own installation. Both are projections of
# records the installation already keeps, and neither is in the request path.
# Both render nothing yet: the work that fills them is scheduled, and the
# toggles are here so that a deployment's values do not have to change when it
# lands.
extensions:
  # Rollups at index time and a monthly immutable statement. Needs a profile
  # composed from a metering preset, or there is no copy to compute from.
  billing:
    enabled: false
  # A usage consumer counting into a cache, an hourly reconciler, and the
  # decision point in front of the application. Needs `mode: stream`: without
  # a stream there is nothing for a second consumer to read.
  quotas:
    enabled: false

# Metrics, pushed over OTLP. Empty sends nothing and costs nothing. The counter
# to alert on is audit.writer.index.deferred: see docs/operations/runbook.md.
telemetry:
  otlpEndpoint: ""

# Catalogues mounted for the writer at start-up, as name -> document. The
# common catalogue is built in and needs no entry here. Most deployments leave
# this empty: the application registers its own over RegisterCatalogue.
catalogues: {}

# The index and the shared deduplication table. Without it the writer indexes
# nothing, deduplicates in process, and may only run one replica.
database:
  # A Secret holding the Postgres URL. Inline `url` is for a trial install.
  url: ""
  existingSecret: ""
  secretKey: url
  # The schema is applied by a hook Job before the writer rolls. The writer
  # refuses to start against a schema version it does not know, and must never
  # migrate itself: several replicas would race.
  migrate: true

# Pseudonymisation keys.
# Whether the identifiers this installation receives for people outside the
# organisation are already opaque — ones an application minted, which name
# nobody without that application's own database. Where they are, a profile
# asking for a pseudonym gets the identifier in clear instead, because
# encrypting an opaque identifier a second time adds a key to lose and tells a
# reader of the archive nothing new; and the writer refuses a record whose
# external identifier looks direct, an address say.
#
# An installation with no key provider must set this or compose only profiles
# that keep nobody: see docs/decisions/0013-no-pseudonymisation-keys-by-default.md.
externalIdentifiersAreOpaque: false

keys:
  # `none` (the default: no pseudonyms, no key material, no resolve), `local`
  # (a root Secret and a directory) or `transit` (OpenBAO). Most deployments
  # want none — staff are kept in clear because that is what accountability is
  # for, and people outside arrive as identifiers the application already
  # minted. Choose a provider where a contract obliges you to be able to
  # crypto-shred. Transit is the one for more than one replica: the keys never
  # leave the engine, every replica asks the same one, and there is no
  # directory to lose. See docs/operations/openbao-keys.md for the policies the
  # engine needs.
  provider: none
  # Under `openbao` below.
  transit:
    # Every key is <prefix>.<purpose>.<tenant>; the policies glob on it.
    prefix: audit
    # How the writer signs in, one of three. `role` is a role on
    # `openbao.auth.mount`, taken with the writer's projected service-account
    # token: nothing stored. Otherwise a token Secret, or a file something else
    # keeps renewed. Its policy grants hmac and encrypt on the writer's
    # purposes and nothing on transit/keys.
    role: ""
    token:
      existingSecret: ""
      secretKey: token
    tokenFile: ""
  local:
    # A Secret holding the 32-byte root the data keys are wrapped under.
    existingSecret: ""
    secretKey: root
    persistence:
      # Data keys are random, not derived from the root, so the directory they
      # are wrapped into is the only copy. Losing it re-keys every tenant
      # silently: the same person gets a new pseudonym and the trail before the
      # restart stops linking to the trail after it.
      enabled: true
      size: 1Gi
      storageClass: ""
      # ReadWriteMany is what lets several replicas agree about a tenant's key.
      # With ReadWriteOnce this chart renders one writer only.
      accessModes: [ReadWriteOnce]
      existingClaim: ""
    # Set only for a throwaway install. It acknowledges that pseudonyms will
    # change on every restart, which makes the trail unlinkable across one.
    ephemeralIsAcceptable: false

# The OpenBAO this release reaches: for the transit key provider, and for the
# digest signer if it signs with a transit key.
openbao:
  address: ""
  mount: transit
  # The namespace the engine and the auth mount are in; in an estate with a
  # namespace per environment, the environment's. Empty is root.
  namespace: ""
  # A JWT auth mount that takes this cluster's service-account tokens, e.g.
  # jwt-devel. Each component that names a `role` signs in on it with a
  # projected token of this audience, replaced by the kubelet before it
  # expires, and signs in again when its session's lease runs out.
  auth:
    mount: ""
    audience: openbao
    expirationSeconds: 600

# A CA bundle trusted beside the system roots — typically trust-manager's
# ConfigMap of a private chain. Every pod that reaches OpenBAO or Postgres
# mounts it: OpenBAO calls take it as their CA, and Postgres connections read it
# through PGSSLROOTCERT, so a server certificate from that chain is verified.
trust:
  configMap: ""
  key: ca.crt

# The wide stream. Without a URL the writer only serves its own sink, which is
# what an application that publishes straight to it wants.
stream:
  url: ""
  name: AUDIT
  consumer: audit-writer
  batch: 100
  # How long the stream waits for a batch before offering it again. It must
  # exceed the longest a write can honestly take: a batch is acknowledged only
  # once its records are in the archive.
  ackWait: 2m

# How often an object is rolled and put.
# The roll: how much a writer consuming the stream gathers before it writes,
# which is what decides how many objects a day of records becomes. Fetching
# from a stream returns whatever is there, and writing each fetch straight
# through would make an object of each; an archive of many tiny objects costs a
# request to put, a line in every hour's digest and an entry in every listing,
# forever.
#
# Nothing is lost by waiting: the messages stay unacknowledged until the writer
# has taken them, so a consumer that dies mid-window leaves them on the stream.
# `stream.ackWait` must stay longer than `interval` plus the longest a put can
# take, and the chart refuses to render otherwise.
#
# In direct mode there is no stream to gather from, and `interval` is only how
# long an object may stay open inside one write.
roll:
  interval: 30s
  maxRecords: 5000

service:
  type: ClusterIP
  port: 8080

# The scheduled jobs. Each records what it did through the writer's own sink,
# so each needs to reach it.
jobs:
  digest:
    enabled: true
    schedule: "7 * * * *"
    # Sealing is a different privilege from writing: the signing key must not
    # live where the writer's credentials do, so this job has a service account
    # of its own.
    serviceAccount:
      create: true
      annotations: {}
    signingKey:
      existingSecret: ""
      secretKey: key.pem
      keyID: ""
    # Sign with an AWS KMS ECC_NIST_P256 key instead of a key Secret. The
    # private half never leaves KMS, so writing the archive and vouching for it
    # stay different privileges: the digest job's role has kms:Sign, the
    # writer's does not. Export the public half for verification with
    # `audit key public --kms-key <id>`.
    kmsKey: ""
    # Or sign with an OpenBAO transit ed25519 key: the same separation, for a
    # deployment whose secrets live in OpenBAO. The engine is `openbao`; this
    # is the key and how the job signs in — one of three, as for the writer,
    # and never the writer's.
    transit:
      key: ""
      role: ""
      token:
        existingSecret: ""
        secretKey: token
      tokenFile: ""
    lookback: ""
    maxWindows: 0
  verify:
    enabled: true
    schedule: "23 3 * * *"
    # How far back last night's run checks.
    window: 24h
    # Write each window's result under verified/ in the archive, which is
    # where a record's verified_at comes from. Its role then needs
    # s3:PutObject on verified/* and nothing else it did not have; turned off,
    # the job is read-only and records nothing a reader can see per record.
    record: true
    # Credentials that read the archive, and the public half of the signing key.
    serviceAccount:
      create: true
      annotations: {}
    publicKey:
      existingSecret: ""
      secretKey: public.pem
  purge:
    enabled: true
    schedule: "41 4 * * *"
    # How long the index keeps who an event happened to, as opposed to what
    # happened. Empty means nothing is forgotten early: no preset this library
    # ships states such a schedule, so the number is a deployment's own policy.
    identifyingAfter: ""
    dedupeWindow: ""
  clockSync:
    enabled: true
    schedule: "13 2 * * *"
    ntp: []
    # Beyond this the run fails, so the job going red is the alert.
    maxOffset: 1s

serviceAccount:
  create: true
  # Pod Identity or IRSA goes here.
  annotations: {}
  name: ""

# Who may reach each component. The writer's sink takes this release's own
# pods (the jobs and the query service record through it) and
# whatever `ingressFrom` adds — the namespaces of the workloads that emit.
# The query service takes `queryIngressFrom`, normally the gateway in front of
# it; empty leaves it open inside the cluster, because a read path nobody can
# reach is not a safe default but a broken one.
networkPolicy:
  enabled: false
  # Selectors for what may reach the writer's sink.
  ingressFrom: []
  # Selectors for what may reach the query service.
  queryIngressFrom: []

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
