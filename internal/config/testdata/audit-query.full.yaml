apiVersion: audit.truvity.github.io/audit-query/v2
secrets:
  source: file
  root: /etc/audit/secrets
listen:
  address: ":8080"
searcher: postgres
database:
  url: postgres://audit_reader@db.example.test:5432/audit
  passwordSecret: query-database-password
  maxConnections: 5
grants: /etc/audit/grants.yaml
deployment: /etc/audit/deployment.yaml
sink:
  url: http://audit:8080
  tokenFile: /var/run/audit/token
  expect: archived
archive:
  bucket:
    name: audit-archive
  prefix: app
exports:
  bucket:
    name: audit-exports
    endpoint: https://files.example.test
    pathStyle: true
    credentialsSecret:
      accessKeyID: archive-access-key-id
      secretAccessKey: archive-secret-access-key
  expiry: 168h0m0s
  linkValid: 1h0m0s
keys:
  provider: local
  local:
    rootFile: /etc/audit/keys/root
    dir: /var/lib/audit/keys
require: queued
