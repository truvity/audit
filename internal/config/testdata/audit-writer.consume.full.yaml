apiVersion: audit.truvity.github.io/audit-writer/v2
# The writer's longhand consumer, every key set: an SQS queue, with the
# credentials the SDK finds, so none are here.
mode: writer
require: queued
deployment: /etc/audit/deployment.yaml
workloads: /etc/audit/workloads.yaml
archive:
  bucket:
    name: audit-archive
consume:
  sqs:
    queueUrl: https://sqs.eu-example-1.amazonaws.com/ACCOUNT/audit.fifo
    region: eu-example-1
    fifo: true
    batch: 10
    visibility: 2m0s
