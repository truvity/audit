apiVersion: audit.truvity.github.io/audit-writer/v2
secrets:
  source: file
  root: /etc/audit/secrets
# Every key the writer reads, set. The test that decodes this file strictly and
# writes it back is what holds the Go type to the schema.
mode: writer
require: archived
listen:
  address: ":8080"
deployment: /etc/audit/deployment.yaml
workloads: /etc/audit/workloads.yaml
catalogues: /etc/audit/catalogues
archive:
  bucket:
    name: audit-archive
    region: eu-example-1
    endpoint: https://s3.example.test
    ca: /etc/audit/trust/ca.crt
    pathStyle: true
    credentialsSecret:
      accessKeyID: archive-access-key-id
      secretAccessKey: archive-secret-access-key
  prefix: app
  lockMode: governance
  kmsKey: alias/audit
database:
  url: postgres://audit@db.example.test:5432/audit?sslmode=verify-full
  passwordSecret: database-password
  maxConnections: 20
replicas: 3
keys:
  provider: transit
  transit:
    prefix: audit
    openbao:
      address: https://openbao.example.test:8200
      mount: transit
      namespace: devel
      caFile: /etc/audit/trust/ca.crt
      login:
        mount: jwt-devel
        role: audit-writer
        jwtFile: /var/run/openbao/token
forgetIdentities: true
stream:
  nats:
    url: nats://nats.example.test:4222
    tokenFile: /var/run/audit/stream/token
  name: AUDIT
  consumer: audit-writer
  batch: 200
  ackWait: 3m0s
roll:
  interval: 45s
  maxRecords: 1000
