apiVersion: truvity.github.io/audit-writer/v1
# A receiver forwarding to SQS, every key it has set.
mode: receiver
require: queued
listen:
  address: ":8080"
deployment: /etc/audit/deployment.yaml
workloads: /etc/audit/workloads.yaml
database:
  url: postgres://audit@db.example.test:5432/audit?sslmode=verify-full
  passwordEnv: AUDIT_DATABASE_PASSWORD
forward:
  sqs:
    queueUrl: https://sqs.eu-example-1.amazonaws.com/ACCOUNT/audit
    region: eu-example-1
