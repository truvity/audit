name: billing-nl
framework: "Dutch tax administration duty: Algemene wet inzake rijksbelastingen art. 52 (bewaarplicht) and the Belastingdienst brochure on automated administration"
version: "2026.09"
summary: The usage-billing profile. What finance, a customer in a dispute and the tax inspector read. Quantities per tenant and meter, never people.
disclaimer: "This preset is an engineering reading of the cited clauses, not legal advice. A deployer confirms applicability, numbers and scope with its own assessor, auditor or counsel."
citations:
  - clause: "AWR art. 52 — books, records and other data carriers kept for 7 years, auditable within a reasonable time"
    url: https://wetten.overheid.nl/BWBR0002320
  - clause: "Belastingdienst — administratie bewaren: 7 years; basisgegevens cannot be shortened by agreement"
    url: https://www.belastingdienst.nl/wps/wcm/connect/bldcontentnl/belastingdienst/zakelijk/btw/administratie_bijhouden/administratie_bewaren/
  - clause: "Belastingdienst — Uw geautomatiseerde administratie en de fiscale bewaarplicht §2.3 and §3.1: detail data behind condensed figures must be kept 7 years; data must be demonstrably original, correct and unchanged"
    url: https://download.belastingdienst.nl/belastingdienst/docs/geautomatiseerde_administratie_en_fiscale_bewaarplicht_al0401z6fd.pdf
  - clause: "Hoge Raad 29 June 2021, ECLI:NL:HR:2021:987 — detail data of orders and settlements are part of the administration and fall under art. 52"
    url: https://uitspraken.rechtspraak.nl/details?id=ECLI:NL:HR:2021:987
  - clause: "GDPR Art. 5(1)(c) data minimisation; Art. 17(3)(b) erasure does not apply to records kept under a legal obligation"
    url: https://gdpr-info.eu/art-17-gdpr/
field_classes: [shared, metering]
optional_fields:
  - /recorded_at
  - /schema_version
  - /catalogue_version
  - /sequence
  - /observer
  - /origin_hash
  - /profile
  - /data
required_fields:
  - /id
  - /occurred_at
  - /recorded_at
  - /source
  - /action
  - /outcome/result
  - /tenant_id
  - /meter/name
  - /meter/quantity
  - /meter/unit
  - /meter/kind
  - /origin_hash
forbidden_fields:
  - /actor
  - /subject
  - /context
  - /capture
  - /previous_attributes
  - /attributes
  - /unmapped
forbidden_pii: [identifier, direct, content]
required_categories:
  - billing
identity:
  internal: omit
  external: omit
  machine: omit
retention:
  policy: fixed
  days: 2557
  hot_days: 90
  configurable: true
  minimum_days: 2557
  delete_at_end: true
  note: "7 years from the moment the data lose their current value; the invoice period is the practical start. Immutable monthly statements naming their digest are the condensed figures; these copies are the detail behind them."
integrity:
  digest: required
  object_lock_mode: none
  timestamp_anchor: none
  legal_hold: available
  clock_sync_event: none
  log_access_logged: true
  note: "AWR art. 52 asks for the authenticity and integrity of the administration over the retention period, which the signed digest chain provides; it does not mandate WORM storage. A lock is optional."
review:
  automated_alerting: true
  cadence: monthly
  evidence: "The month-close reconciliation: rollups recomputed from the copies and diffed against the statement."
pipeline:
  dedupe_window_days: 45
  stream_horizon_days: 7
  close_after_hours: 72
