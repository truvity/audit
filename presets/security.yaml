name: security
framework: "NIS2 (Directive (EU) 2022/2555) with Implementing Regulation (EU) 2024/2690 Annex §3.2; ISO/IEC 27001:2022 Annex A 8.15, 8.16, 8.17; PCI DSS v4.0.1 Requirement 10 as the prescriptive floor"
version: "2026.09"
summary: The security operations profile. What a SOC, an incident responder or an ISMS auditor reads.
disclaimer: "This preset is an engineering reading of the cited clauses, not legal advice. A deployer confirms applicability, numbers and scope with its own assessor, auditor or counsel."
citations:
  - clause: "CIR (EU) 2024/2690 Annex 3.2.3 — events to log: user lifecycle, access to systems and applications, authentication, all privileged access, changes to critical configuration, access to logs"
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ:L_202402690
  - clause: "CIR (EU) 2024/2690 Annex 3.2.4–3.2.6 — regular review; maintain and back up logs for a predefined period and protect them from unauthorised access or changes; synchronised time sources; redundant logging"
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ:L_202402690
  - clause: "ISO/IEC 27002:2022 8.15 — each event: user id, activity, date/time, device or system identifier, network addresses; users including administrators must not be able to amend or delete their own activity logs"
    url: https://www.iso.org/standard/75652.html
  - clause: "ISO/IEC 27001:2022 A.8.17 — clock synchronisation to approved sources"
    url: https://www.iso.org/standard/27001
  - clause: "PCI DSS v4.0.1 10.2.2 — per record: user identification, type of event, date and time, success or failure, origination, identity of affected data, component or resource"
    url: https://www.pcisecuritystandards.org/document_library/
  - clause: "PCI DSS v4.0.1 10.5.1 — retain at least 12 months, most recent 3 months immediately available"
    url: https://www.pcisecuritystandards.org/document_library/
  - clause: "GDPR Recital 49 — network and information security as a legitimate interest; Art. 5(1)(e) storage limitation"
    url: https://gdpr-info.eu/recitals/no-49/
field_classes: [shared, audit]
optional_fields:
  - /recorded_at
  - /schema_version
  - /catalogue_version
  - /sequence
  - /observer
  - /origin_hash
  - /profile
  - /subject
  - /actor
  - /targets
  - /context
  - /capture
  - /data
  - /attributes
  - /unmapped
required_fields:
  - /id
  - /occurred_at
  - /recorded_at
  - /source
  - /observer/id
  - /action
  - /operation
  - /outcome/result
  - /tenant_id
  - /actor/kind
  - /actor/id
  - /context/client_addresses
forbidden_pii: [direct, content]
required_categories:
  - authentication
  - privileged_access
  - account_lifecycle
  - configuration_change
  - log_access
  - logging_control
identity:
  internal: clear
  external: pseudonym
  machine: clear
retention:
  policy: fixed
  days: 365
  hot_days: 90
  configurable: true
  minimum_days: 180
  delete_at_end: true
  note: "PCI DSS fixes 12 months with 3 hot; NIS2, ISO 27001 and DORA leave the number to the entity; French CNIL guidance suggests 6 months extendable to 12 for logs with personal data. 365 is the defended default; deployments in PCI scope compose the pci-dss preset which raises the minimum."
integrity:
  digest: required
  object_lock_mode: compliance
  timestamp_anchor: none
  legal_hold: available
  clock_sync_event: daily
  log_access_logged: true
review:
  automated_alerting: true
  cadence: weekly
  evidence: "Alert dispositions and a dated review note per cadence, kept as ISMS evidence."
pipeline:
  dedupe_window_days: 14
  stream_horizon_days: 7
