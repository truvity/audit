// The canonical audit record. This file is the schema of record; the JSON
// Schema published under docs/reference is generated from it and composed
// with the extension slots an application registers (see docs/concepts.md).
//
// JSON encoding: field names are emitted as written here (snake_case) and
// both snake_case and lowerCamelCase are accepted on input. Timestamps are
// RFC 3339 in UTC.
//
// Versioning: the package name carries the major version. A breaking
// change is a new package (audit.v2); additive changes bump
// Record.schema_version's minor. Readers keep a decoder for every major
// that was ever written, because Object Lock keeps those objects for years.
// See docs/decisions/0009-versioning-policy.md.
syntax = "proto3";

package audit.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Record is one thing that happened, as seen by one source.
//
// Field classes (docs/concepts.md): shared fields appear in every profile
// copy; audit-only fields appear only in profiles that keep them; metering
// fields appear in billing profiles. The class of a core field is fixed
// here; the class of an extension property is an annotation on its schema.
message Record {
  // Identity of the record. UUIDv7 minted by the emitter; the idempotency
  // key at every hop. Shared.
  string id = 1;

  // When the thing happened, from the emitter's synchronised clock. Shared.
  google.protobuf.Timestamp occurred_at = 2;

  // When the split writer accepted the record. Set by the writer, never by
  // the emitter. Drives the tail cursor and lateness alerts. Shared.
  google.protobuf.Timestamp recorded_at = 3;

  // Core schema version, "major.minor". Equal-on-major, greater-or-equal-
  // on-minor is the compatibility contract. Shared.
  string schema_version = 4;

  // Version of the source's catalogue that describes this action and its
  // extension slots. Resolved by the writer; unknown versions dead-letter,
  // never drop. Shared.
  string catalogue_version = 5;

  // The system the event is about ("keycloak", "wallet", "roster"). Also
  // the namespace prefix of `action`. Shared.
  string source = 6;

  // Who reported the record. Stamped by the writer from the publisher's
  // verified workload identity; an emitter cannot set it. Shared.
  Observer observer = 7;

  // Sequence per producer instance, monotonic, for gap detection. The
  // producer name is `observer.instance`. Shared.
  uint64 sequence = 8;

  // What happened, "resource.verb" under the source's namespace, from the
  // catalogue. Shared.
  string action = 9;

  // Coarse classification of the action, orthogonal to `action`. Shared.
  Operation operation = 10;

  // How it ended. Shared.
  Outcome outcome = 11;

  // The customer the record belongs to. A legal entity, never a person.
  // Stays in clear in every profile. A reserved value names the platform
  // itself for events with no tenant. Shared.
  string tenant_id = 12;

  // Whom it concerns, when that is not the actor. Identity treatment is
  // decided by the subject kind's registration. Audit and history.
  Party subject = 13;

  // Who did it. Identity treatment is decided by the actor kind's
  // registration. Audit and history.
  Actor actor = 14;

  // What it was done to. Audit, history and evidence.
  repeated Target targets = 15;

  // Where it came from. Audit.
  Context context = 16;

  // Request and response capture, level-gated and size-capped. Audit.
  Capture capture = 17;

  // On update actions only: the prior values of changed attributes, whole
  // arrays when any element changed. History.
  google.protobuf.Struct previous_attributes = 18;

  // Extension slot keyed by `action`; validated against the schema the
  // catalogue registers for it. Class per property by annotation.
  google.protobuf.Struct data = 19;

  // Usage measurement for billing profiles. Metering.
  Meter meter = 20;

  // Bounded free-form attributes for what has no schema yet. Bounds are
  // enforced by the emitter library (key count, key and value length).
  // Audit.
  map<string, string> attributes = 21;

  // Fields a source could not map onto the record. Kept so nothing is
  // silently lost; promoted to `data` or the core when they recur. Audit.
  google.protobuf.Struct unmapped = 22;

  // Set by the writer on every profile copy: SHA-256 of the canonical wide
  // record before the split, so copies are provably the same original.
  // Shared.
  string origin_hash = 23;

  // Set by the writer on a profile copy: which profile this copy is.
  // Absent on the wire from an emitter.
  string profile = 24;
}

// Operation is the coarse action class, kept small on purpose.
enum Operation {
  OPERATION_UNSPECIFIED = 0;
  OPERATION_CREATE = 1;
  OPERATION_ACCESS = 2;
  OPERATION_MODIFY = 3;
  OPERATION_REMOVE = 4;
  OPERATION_AUTHENTICATION = 5;
  OPERATION_TRANSFER = 6;
  OPERATION_RESTORE = 7;
}

// Outcome is how the action ended, with a source-specific code.
message Outcome {
  Result result = 1;
  // Human-readable reason, bounded, never containing secrets.
  string reason = 2;
  // Source-specific code ("held", "rate_limited", an HTTP status).
  string code = 3;

  enum Result {
    RESULT_UNSPECIFIED = 0;
    RESULT_SUCCESS = 1;
    RESULT_FAILURE = 2;
    RESULT_DENIED = 3;
    RESULT_UNKNOWN = 4;
  }
}

// Observer is the reporting component, stamped by the writer.
message Observer {
  // Verified workload identity of the publisher.
  string id = 1;
  // Component version.
  string version = 2;
  // Instance name (pod name), the producer of `sequence`.
  string instance = 3;
}

// Party is a subject: a kind from the registry and its identifier. The
// identifier is a stable id or a keyed pseudonym; never a name or e-mail.
message Party {
  string kind = 1;
  string id = 2;
}

// Actor is who acted. `kind` selects a registered actor kind, which
// declares the schema of `attributes` and the identity treatment.
message Actor {
  string kind = 1;
  string id = 2;
  // Session identifier, if any. Audit only; hashed by the writer when the
  // actor kind says so.
  string session_id = 3;
  // How the actor authenticated ("oidc", "api_key", "mtls", "recovery").
  string auth_method = 4;
  // SHA-256 of the credential used, base64, so a token can be found without
  // ever storing it.
  string credential_hash = 5;
  // Kind-specific attributes, validated against the kind's schema.
  google.protobuf.Struct attributes = 6;
}

// Target is what the action was done to. `type` selects a registered
// target type, which declares the schema of `attributes` and whether
// `name` may be carried.
message Target {
  string type = 1;
  string id = 2;
  // Display name, allowed only where the target type's registration says
  // the target is not a person.
  string name = 3;
  google.protobuf.Struct attributes = 4;
}

// Context is the request provenance.
message Context {
  // Client address chain, nearest last, as the trusted hop count leaves it.
  repeated string client_addresses = 1;
  string user_agent = 2;
  string request_id = 3;
  string trace_id = 4;
  string span_id = 5;
  // Extension slots keyed by area ("http", "rpc", "k8s", "github"), each
  // validated against the area's registered schema.
  map<string, google.protobuf.Struct> areas = 6;
}

// Capture is the level-gated request and response snapshot.
message Capture {
  Level level = 1;
  google.protobuf.Struct request = 2;
  google.protobuf.Struct response = 3;
  // True when any capped field was truncated, in the documented order.
  bool truncated = 4;

  enum Level {
    LEVEL_UNSPECIFIED = 0;
    LEVEL_METADATA = 1;
    LEVEL_REQUEST = 2;
    LEVEL_REQUEST_RESPONSE = 3;
  }
}

// Meter is the usage measurement of a billable action or a periodic gauge
// sample. Counts are events; gauges are absolute samples, never deltas.
message Meter {
  // Meter name from the catalogue.
  string name = 1;
  // Decimal string, exact ("1", "1048576", "0.25").
  string quantity = 2;
  string unit = 3;
  Kind kind = 4;
  // Flat primitives only, validated against the meter's dimensions schema.
  google.protobuf.Struct dimensions = 5;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_COUNT = 1;
    KIND_GAUGE = 2;
  }
}
