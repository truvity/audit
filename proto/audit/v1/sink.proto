// The write contract. One interface for every hop: an emitter calls it, a
// queue publisher implements it, a queue consumer calls it on the split
// writer, an adapter outside the cluster calls it over Connect. The queue
// in between is invisible to both ends. See
// docs/decisions/0004-sink-interface-and-transports.md.
syntax = "proto3";

package audit.v1;

import "audit/v1/record.proto";

service SinkService {
  // Write accepts a batch. The acknowledgement always means durable: the
  // object is in the archive, or the stream has replicated it. What the
  // delivery says is who waits for that. With DELIVERY_BLOCK the emitter's
  // caller waits, and the business request does not complete until the
  // record is kept. With DELIVERY_ASYNC the emitter's own queue waits,
  // retrying until this call is acknowledged.
  rpc Write(WriteRequest) returns (WriteResponse);
}

message WriteRequest {
  repeated Record records = 1;
  Delivery delivery = 2;
}

enum Delivery {
  DELIVERY_UNSPECIFIED = 0;
  DELIVERY_BLOCK = 1;
  // Retired on 2026-09-22 by
  // docs/decisions/0012-two-deliveries-and-a-durable-ack.md. They stay in the
  // enum so that a record written under them still decodes — this package is
  // v1 and a value removed is a record nobody can read — and the catalogue
  // loader refuses both by name, saying what to write instead.
  DELIVERY_OUTBOX = 2 [deprecated = true];
  DELIVERY_BEST_EFFORT = 3 [deprecated = true];
  // The default. The call returns at once and the emitter keeps the record in
  // a bounded queue, retrying until it is acknowledged.
  DELIVERY_ASYNC = 4;
}

message WriteResponse {
  int32 accepted = 1;
  // Records refused at this hop, by id, with a machine-readable reason.
  // A whole batch is refused before any record is accepted when the
  // refusal is structural (unknown catalogue version, schema violation).
  repeated Rejection rejected = 2;
}

message Rejection {
  string id = 1;
  string reason = 2;
}
