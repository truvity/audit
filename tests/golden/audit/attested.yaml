# Source: audit/templates/cronjobs.yaml
# Nightly. Checks each profile's record objects of the last day against the
# bucket contract (key, metadata, sha256, the hash of every record) and, with
# `seals.roots`, the seals too: their signatures against the pinned roots, the
# chain, each hour's count and root against its objects, and that no due seal is
# missing. It reports what it finds; a non-zero exit is the alert. It reads the
# archive and nothing else, which is what lets an auditor run the same command
# and get the same answer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-verify-config
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: verify
data:
  # What the binary reads with --config: validated against
  # schemas/config/ at start-up, and by this chart's values.schema.json before
  # it renders.
  config.yaml: |
    archive:
      bucket:
        credentialsEnv:
          accessKeyID: AUDIT_S3_ACCESS_KEY_ID
          secretAccessKey: AUDIT_S3_SECRET_ACCESS_KEY
        endpoint: https://s3.example.test
        name: audit-archive
        pathStyle: true
        region: auto
      prefix: audit/app
    deployment: /etc/audit/deployment.yaml

---
# Source: audit/templates/cronjobs.yaml
# Daily. Compares this cluster's clock with UTC and records the answer, which is
# what ETSI EN 319 401 7.10 asks for. It never sets the clock. A drift beyond
# the tolerance fails the run, so the job going red is the alert.
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-clock-sync-config
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: clock-sync
data:
  # What the binary reads with --config: validated against
  # schemas/config/ at start-up, and by this chart's values.schema.json before
  # it renders.
  config.yaml: |
    ntp:
    - time.example.test

