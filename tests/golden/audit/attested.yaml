# Source: audit/templates/query.yaml
# The read path. It reads the index as a role that does not own the tables, so
# the tenant policies bind it; it reads the archive for provenance; it records
# every read through the writer before answering; and it holds the keys only
# if it may resolve.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-query
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: query
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audit
      app.kubernetes.io/instance: audit
      app.kubernetes.io/component: query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit
        app.kubernetes.io/instance: audit
        app.kubernetes.io/component: query
      annotations:
        checksum/config: 8d8243745525dfcc297348bc95ddefb96cc408ec0504f8b9746dddc2494f6a02
        checksum/grants: 9dc7463633c5c1fa2aa226620cb1577a4cdc9cf47bda4233c4f758980e8d4d42
        # A grant preset turns roles into profiles, so the profiles are part
        # of what a grant means.
        checksum/deployment: 861e77485e7277521b936ce77c5bf1b0113804af1756faf737f106afdb832f2f
    spec:
      serviceAccountName: audit-query
      
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: query
          image: ghcr.io/truvity/audit/audit-query:0.0.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/audit/config.yaml
          env:
            
            - name: AUDIT_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: audit-store-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AUDIT_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: audit-store-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AUDIT_EXPORTS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: audit-exports-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AUDIT_EXPORTS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: audit-exports-credentials
                  key: AWS_SECRET_ACCESS_KEY
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            {}
          volumeMounts:
            - name: config
              mountPath: /etc/audit/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: deployment
              mountPath: /etc/audit/deployment.yaml
              subPath: deployment.yaml
              readOnly: true
            - name: grants
              mountPath: /etc/audit/grants.yaml
              subPath: grants.yaml
              readOnly: true
            
            
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: audit-query-config
        - name: deployment
          configMap:
            name: audit-deployment
        - name: grants
          configMap:
            name: audit-grants
        
        
        - name: tmp
          emptyDir: {}

