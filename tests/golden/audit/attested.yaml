# Source: audit/templates/serviceaccount.yaml
# Clock sync only records what it measured through the writer's sink. It needs
# no cloud rights at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-clock-sync
  labels:
    helm.sh/chart: audit-0.0.0
