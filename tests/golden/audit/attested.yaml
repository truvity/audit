# Source: audit/templates/writer.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audit
      app.kubernetes.io/instance: audit
      app.kubernetes.io/component: writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit
        app.kubernetes.io/instance: audit
        app.kubernetes.io/component: writer
      annotations:
        # A changed configuration must reach a running pod, and a file mounted
        # with subPath is never updated in place, so the pod is replaced.
        checksum/config: b9e5176888f6b1763b0dbc9530b2086d6aae689eb3511f61c8145aa94a62b4ff
        # Likewise a change to the profile document, hashed whole: it also holds
        # externalIdentifiersAreOpaque, which changes what a profile keeps.
        checksum/deployment: 861e77485e7277521b936ce77c5bf1b0113804af1756faf737f106afdb832f2f
        # And who may write: a changed issuer or mapping must reach it.
        checksum/workloads: 274aa3accbe10dbf671359ace426a24af2c33648b7017d8008c24e9eb79c4d06
    spec:
      # The process takes up to 30s to stop taking records and write what it
      # holds (the shutdown budget of audit-writer), after the preStop sleep
      # below. The grace period has to outlast both, or the kubelet kills it
      # mid-write and the batch is redelivered.
      terminationGracePeriodSeconds: 45
      serviceAccountName: audit
      
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: writer
          image: ghcr.io/truvity/audit/audit-writer:0.0.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/audit/config.yaml
          env:
            
            - name: AUDIT_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: audit-store-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AUDIT_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: audit-store-credentials
                  key: AWS_SECRET_ACCESS_KEY
          ports:
            - name: http
              containerPort: 8080
          lifecycle:
            # Endpoints and the clients' connections drain after the pod is told
            # to stop, not before: sleeping first keeps it answering until
            # nothing is sent to it. A sleep action, because the image has no shell.
            preStop:
              sleep:
                seconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            {}
          volumeMounts:
            - name: config
              mountPath: /etc/audit/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: deployment
              mountPath: /etc/audit/deployment.yaml
              subPath: deployment.yaml
              readOnly: true
            
            
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: audit-writer-config
        - name: deployment
          configMap:
            name: audit-deployment
        
        
        - name: tmp
          emptyDir: {}

