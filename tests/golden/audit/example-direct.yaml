---
# Source: audit/templates/serviceaccount.yaml
# Sealing is a different privilege from writing: whoever can write the archive
# and also sign a digest for it can choose what to sign. This identity holds the
# signing key; the writer's does not.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-digest
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: audit/templates/serviceaccount.yaml
# Verification needs to read the archive and nothing else. An auditor running
# the same command with the same public key must get the same answer, which is
# what makes the answer worth having.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-verify
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: audit/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-deployment
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  # The document a config names as `deployment`: which presets each profile is
  # composed from, and where its copies land. Every component that reads
  # profiles reads this one, because retention is a property of the profile and
  # every one of them needs to agree about it.
  deployment.yaml: |
    external_identifiers_are_opaque: true
    profiles:
      security:
        presets:
        - security
  # The document a writer's config names as `workloads`: the issuers trusted to
  # name a calling workload, and the source each speaks for.
  workloads.yaml: |
    issuers:
      - url: "https://oidc.example.com/id/CLUSTER"
        audience: "audit"
    workloads:
      - source: app
        subject: system:serviceaccount:app:api

---
# Source: audit/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-writer-config
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: writer
data:
  # What the binary reads with --config: validated against
  # schemas/config/ at start-up, and by this chart's values.schema.json before
  # it renders.
  config.yaml: |
    archive:
      bucket:
        name: audit-eu-example-1
        region: eu-example-1
      kmsKey: alias/audit-archive
      prefix: audit/app
    database:
      passwordEnv: AUDIT_DATABASE_PASSWORD
      url: postgres://audit@db.example.com:5432/audit?sslmode=verify-full
    deployment: /etc/audit/deployment.yaml
    replicas: 2
    workloads: /etc/audit/workloads.yaml

