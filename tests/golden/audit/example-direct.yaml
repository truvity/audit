# Source: audit/templates/cronjobs.yaml
# Nightly. Walks each profile's chain and reports what it finds; a non-zero
# exit is the alert. It takes the public half of the signing key only, which is
# what lets an auditor run the same command and get the same answer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-verify-config
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: verify
data:
  # What the binary reads with --config: validated against
  # schemas/config/ at start-up, and by this chart's values.schema.json before
  # it renders.
  config.yaml: |
    archive:
      bucket:
        name: audit-eu-example-1
        region: eu-example-1
      prefix: audit/app
    deployment: /etc/audit/deployment.yaml
    publicKeyFile: /etc/audit/public/public.pem
    sink:
      tokenFile: /var/run/audit/token
      url: http://audit:8080

