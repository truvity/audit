                  mountPath: /etc/audit/config.yaml
                  subPath: config.yaml
                  readOnly: true
                
                - name: trust
                  mountPath: /etc/audit/trust
                  readOnly: true
                
                - name: token-0
                  mountPath: /var/run/openbao
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: audit-notary-config
            
            - name: trust
              configMap:
                name: private-ca-bundle
            
            - name: token-0
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      audience: "openbao"
                      expirationSeconds: 600
