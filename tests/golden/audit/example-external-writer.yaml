        spec:
          restartPolicy: OnFailure
          serviceAccountName: audit-notary
          
          securityContext:
            fsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: notary
              image: ghcr.io/truvity/audit/audit-notary:0.0.0
              imagePullPolicy: IfNotPresent
              args:
                - --config=/etc/audit/config.yaml
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
