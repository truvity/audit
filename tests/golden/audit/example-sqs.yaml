# Source: audit/templates/writer.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: audit
      app.kubernetes.io/instance: audit
      app.kubernetes.io/component: writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit
        app.kubernetes.io/instance: audit
        app.kubernetes.io/component: writer
      annotations:
        # A changed configuration must reach a running pod, and a file mounted
        # with subPath is never updated in place, so the pod is replaced.
        checksum/config: d8cd67f0ad14f148ebcae701a2d77531ebd82cbcb33f49fdac53a5f9ca949175
        # Likewise a profile change.
        checksum/deployment: 5eacd6a942679dbcd129e785ee9432ef5945af9138235dadaf95cbcd5e92b58b
        # And who may write: a changed issuer or mapping must reach it.
        checksum/workloads: 360c77444ad031953e9da11ab72cb75391704ccd40c9012d4fa616346c75c587
    spec:
      serviceAccountName: audit-receiver
      
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: ghcr.io/truvity/audit/audit-writer:0.0.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/audit/config.yaml
          env:
            
            - name: AUDIT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: audit-db
                  key: password
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            {}
          volumeMounts:
            - name: config
              mountPath: /etc/audit/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: deployment
              mountPath: /etc/audit/deployment.yaml
              subPath: deployment.yaml
              readOnly: true
            - name: deployment
              mountPath: /etc/audit/workloads.yaml
              subPath: workloads.yaml
              readOnly: true
            
            
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: audit-receiver-config
        - name: deployment
          configMap:
            name: audit-deployment
        
        
        - name: tmp
          emptyDir: {}

