# Source: audit/templates/writer.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: audit
      app.kubernetes.io/instance: audit
      app.kubernetes.io/component: writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit
        app.kubernetes.io/instance: audit
        app.kubernetes.io/component: writer
      annotations:
        # A changed configuration must reach a running pod, and a file mounted
        # with subPath is never updated in place, so the pod is replaced.
        checksum/config: e54f8fbdfcaf7afcfc6a9188b122c6a199d0070710b902f8b643b7a600bb73d5
        # Likewise a change to the profile document, hashed whole: it also holds
        # externalIdentifiersAreOpaque, which changes what a profile keeps.
        checksum/deployment: 3cf5d4189a49067986764efdfb49280818d399f4d2e1cef580a4e37d1b9d7a52
        # And who may write: a changed issuer or mapping must reach it.
        checksum/workloads: 360c77444ad031953e9da11ab72cb75391704ccd40c9012d4fa616346c75c587
    spec:
      # The process takes up to 30s to stop taking records and write what it
      # holds (the shutdown budget of audit-writer), after the preStop sleep
      # below. The grace period has to outlast both, or the kubelet kills it
      # mid-write and the batch is redelivered.
      terminationGracePeriodSeconds: 45
      serviceAccountName: audit-receiver
      
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: ghcr.io/truvity/audit/audit-writer:0.0.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/audit/config.yaml
          ports:
            - name: http
              containerPort: 8080
          lifecycle:
            # Endpoints and the clients' connections drain after the pod is told
            # to stop, not before: sleeping first keeps it answering until
            # nothing is sent to it. A sleep action, because the image has no shell.
            preStop:
              sleep:
                seconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            {}
          volumeMounts:
            - name: config
              mountPath: /etc/audit/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: deployment
              mountPath: /etc/audit/deployment.yaml
              subPath: deployment.yaml
              readOnly: true
            - name: deployment
              mountPath: /etc/audit/workloads.yaml
              subPath: workloads.yaml
              readOnly: true
            
            
            - name: secret-files
              mountPath: /etc/audit/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: audit-receiver-config
        - name: deployment
          configMap:
            name: audit-deployment
        
        
        - name: secret-files
          projected:
            # Readable by the owner and the pod's fsGroup and by nobody else.
            defaultMode: 0440
            sources:
              - secret:
                  name: audit-db
                  items:
                    - key: password
                      path: database-password
        - name: tmp
          emptyDir: {}

