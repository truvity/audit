---
# Source: audit/templates/serviceaccount.yaml
# The indexer reads the archive and writes the index. It holds the index's
# write credential, which the writer must not, and reads what the writer wrote
# without being able to write it: a different identity from either. Pod
# Identity or IRSA binds here, with get and list on the archive and nothing more.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-observe
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: audit/templates/serviceaccount.yaml
# The front door publishes and nothing more. It must not hold the archive's
# write identity: a receiver that shares the writer's service account would
# reach the bucket through whatever Pod Identity or IRSA role that binds.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-receiver
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: audit/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-deployment
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  # The document a config names as `deployment`: which presets each profile is
  # composed from, and where its copies land. Every component that reads
  # profiles reads this one, because retention is a property of the profile and
  # every one of them needs to agree about it.
  deployment.yaml: |
    external_identifiers_are_opaque: true
    profiles:
      security:
        presets:
        - security
  # The document a writer's config names as `workloads`: the issuers trusted to
  # name a calling workload, and the source each speaks for.
  workloads.yaml: |
    issuers:
      - url: "https://oidc.example.com/id/CLUSTER"
        audience: "audit"
    workloads:
      - source: app
        subject: system:serviceaccount:app:api

---
# Source: audit/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-writer-config
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: writer
data:
  # What the binary reads with --config: validated against
  # schemas/config/ at start-up, and by this chart's values.schema.json before
  # it renders.
  config.yaml: |
    apiVersion: audit.truvity.github.io/audit-writer/v2
    archive:
      bucket:
        name: audit-eu-example-1
        region: eu-west-1
      kmsKey: alias/audit-archive
      prefix: audit/app
    consume:
      sqs:
        batch: 10
        fifo: true
        queueUrl: https://sqs.eu-west-1.amazonaws.com/ACCOUNT/audit.fifo
        region: eu-west-1
        visibility: 2m
    database:
      passwordSecret: database-password
      url: postgres://audit_writer@db.example.com:5432/audit?sslmode=verify-full
    deployment: /etc/audit/deployment.yaml
    replicas: 3
    require: archived
    roll:
      interval: 30s
      maxRecords: 5000
    secrets:
      root: /etc/audit/secrets
      source: file
    workloads: /etc/audit/workloads.yaml

