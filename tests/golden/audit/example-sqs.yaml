---
# Source: audit/templates/cronjobs.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-digest
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "7 * * * *"
  # A run that overlaps itself only does the same work twice.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audit
            app.kubernetes.io/instance: audit
          annotations:
            checksum/config: d2b754e0d6b2203631ed0cf1494198fab2aa3a05e8b14d1dd6337955d082433d
        spec:
          restartPolicy: OnFailure
          serviceAccountName: audit-digest
          
          securityContext:
            fsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: digest
              image: ghcr.io/truvity/audit/audit:0.0.0
              imagePullPolicy: IfNotPresent
              args:
                - digest
                - --config=/etc/audit/config.yaml
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: config
                  mountPath: /etc/audit/config.yaml
                  subPath: config.yaml
                  readOnly: true
                - name: deployment
                  mountPath: /etc/audit/deployment.yaml
                  subPath: deployment.yaml
                  readOnly: true
                
                
                - name: token-0
                  mountPath: /var/run/audit
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: audit-digest-config
            - name: deployment
              configMap:
                name: audit-deployment
            
            
            - name: token-0
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      audience: "audit"
                      expirationSeconds: 3600
