# Source: audit/templates/observe.yaml
# The indexer. It follows the archive's listing from a cursor per profile and
# tenant kept in Postgres, indexes what is older than the settle window, and
# writes the index the query service reads. It reads the archive and never
# writes it; it writes the index as a role of its own, which holds neither the
# deduplication table nor the registry. Nothing calls it, so it has no Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-observe
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: observe
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audit
      app.kubernetes.io/instance: audit
      app.kubernetes.io/component: observe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit
        app.kubernetes.io/instance: audit
        app.kubernetes.io/component: observe
      annotations:
        checksum/config: e233375235bced710ffa25239ad4545ce2b51d4db2cb95e57d532d3b0fe6838d
    spec:
      serviceAccountName: audit-observe
      
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: observe
          image: ghcr.io/truvity/audit/audit-observe:0.0.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/audit/config.yaml
          env:
            
            - name: AUDIT_OBSERVE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: audit-db-observe
                  key: password
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            {}
          volumeMounts:
            - name: config
              mountPath: /etc/audit/config.yaml
              subPath: config.yaml
              readOnly: true
            
            
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: audit-observe-config
        
        
        - name: tmp
          emptyDir: {}

