# Source: audit/templates/cronjobs.yaml
# Daily. Brings the index and the deduplication table back within what the
# profiles allow. It never touches the archive: those objects are released by
# their object lock, which is what makes a retention a retention.
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-purge-config
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: purge
data:
  # What the binary reads with --config: validated against
  # schemas/config/ at start-up, and by this chart's values.schema.json before
  # it renders.
  config.yaml: |
    database:
      passwordEnv: AUDIT_DATABASE_PASSWORD
      url: postgres://audit_purge@db.example.com:5432/audit?sslmode=verify-full
    deployment: /etc/audit/deployment.yaml

---
# Source: audit/templates/cronjobs.yaml
# Daily. Compares this cluster's clock with UTC and records the answer, which is
# what ETSI EN 319 401 7.10 asks for. It never sets the clock. A drift beyond
# the tolerance fails the run, so the job going red is the alert.
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-clock-sync-config
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: clock-sync
data:
  # What the binary reads with --config: validated against
  # schemas/config/ at start-up, and by this chart's values.schema.json before
  # it renders.
  config.yaml: |
    ntp:
    - 169.254.169.123
    sink:
      tokenFile: /var/run/audit/token
      url: http://audit:8080

