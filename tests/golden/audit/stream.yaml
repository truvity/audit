# Source: audit/templates/cronjobs.yaml
# Hourly. Seals the windows since the last digest into the signed chain. It
# resumes past a missed run on its own, so a failed hour needs no operator: a
# gap in the chain cannot be told from a digest somebody removed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-digest-config
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: digest
data:
  # What the binary reads with --config: validated against
  # schemas/config/ at start-up, and by this chart's values.schema.json before
  # it renders.
  config.yaml: |
    archive:
      bucket:
        name: audit-archive
        region: eu-example-1
      prefix: prod
    deployment: /etc/audit/deployment.yaml
    lookback: 168h
    signer:
      keyFile:
        id: audit-digest-2026
        path: /etc/audit/signing/key.pem
    sink:
      tokenFile: /var/run/audit/token
      url: http://audit:8080

---
# Source: audit/templates/cronjobs.yaml
# Nightly. Walks each profile's chain and reports what it finds; a non-zero
# exit is the alert. It takes the public half of the signing key only, which is
# what lets an auditor run the same command and get the same answer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-verify-config
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: verify
data:
  # What the binary reads with --config: validated against
  # schemas/config/ at start-up, and by this chart's values.schema.json before
  # it renders.
  config.yaml: |
    archive:
      bucket:
        name: audit-archive
        region: eu-example-1
      prefix: prod
    deployment: /etc/audit/deployment.yaml
    publicKeyFile: /etc/audit/public/public.pem
    sink:
      tokenFile: /var/run/audit/token
      url: http://audit:8080

