# Source: audit/templates/migrate.yaml
# The identity this Job runs as, created as a hook of its own so that it
# exists before the Job that names it. A pre-install hook runs BEFORE the
# release's ordinary resources, so a hook Pod cannot name a ServiceAccount
# the release has not created yet: the Job would be admitted and then never
# get a Pod, with "serviceaccount not found" on the Job and a release that
# waits for a hook that can never run. The same is true of its configuration.
#
# It is the migration's own, not the writer's, and it carries no cloud
# annotations. This Job talks to Postgres; it has no business holding the
# credentials that write the archive. A lower weight than the Job so it is
# applied first.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-migrate
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded

---
