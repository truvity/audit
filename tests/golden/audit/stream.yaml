# Source: audit/templates/migrate.yaml
# The index schema, applied before the writer rolls.
#
# A hook rather than something the writer does at start-up: several replicas
# migrating at once is a race, and a schema change to the index should be a step
# an operator can see happen. The writer refuses to start against a version it
# does not know, so this Job failing stops the release rather than producing a
# writer that will not run.
apiVersion: batch/v1
kind: Job
metadata:
  name: audit-migrate
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit
        app.kubernetes.io/instance: audit
    spec:
      restartPolicy: Never
      serviceAccountName: audit-migrate
      
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/truvity/audit/audit:0.0.0
          imagePullPolicy: IfNotPresent
          args:
            - migrate
            - --config=/etc/audit/config.yaml
          env:
            
            - name: AUDIT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: audit-database
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/audit/config.yaml
              subPath: config.yaml
              readOnly: true
            
            
      volumes:
        - name: config
          configMap:
            name: audit-migrate-config
        
        

