# Source: audit/templates/keys-pvc.yaml
# Data keys are random and wrapped into this directory, so it is the only copy
# of them. In stream mode the writers share it, which is why it needs an access
# mode that lets more than one pod mount it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audit-keys
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: "efs"
  resources:
    requests:
      storage: 1Gi

