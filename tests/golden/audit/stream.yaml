# Source: audit/templates/query.yaml
# The read path. It reads the index as a role that does not own the tables, so
# the tenant policies bind it; it reads the archive for provenance; it records
# every read through the writer before answering; and it holds the keys only
# if it may resolve.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-query
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: query
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: audit
      app.kubernetes.io/instance: audit
      app.kubernetes.io/component: query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit
        app.kubernetes.io/instance: audit
        app.kubernetes.io/component: query
      annotations:
        checksum/config: 432a1aeb52dfee3e9c223724dfd8548df1f690d3a3c828d61f5f9ba749924ca7
        checksum/grants: 64a2af7a257e3558f4c717cd5961046d26a7a78787c31965c503d3e1aa5589a9
        # A grant preset turns roles into profiles, so the profiles are part
        # of what a grant means.
        checksum/deployment: 4432a6b2c0ad0165d18cb5a15b6bf7efe83c34765786daad3f77e2c2c970f610
    spec:
      serviceAccountName: audit-query
      
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: query
          image: ghcr.io/truvity/audit/audit-query:0.0.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/audit/config.yaml
          env:
            
            - name: AUDIT_QUERY_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: audit-query-database
                  key: password
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            {}
          volumeMounts:
            - name: config
              mountPath: /etc/audit/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: deployment
              mountPath: /etc/audit/deployment.yaml
              subPath: deployment.yaml
              readOnly: true
            - name: grants
              mountPath: /etc/audit/grants.yaml
              subPath: grants.yaml
              readOnly: true
            - name: keys
              mountPath: /var/lib/audit/keys
              readOnly: true
            
            
            - name: secret-0
              mountPath: /etc/audit/keys
              readOnly: true
            - name: token-0
              mountPath: /var/run/audit
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: audit-query-config
        - name: deployment
          configMap:
            name: audit-deployment
        - name: grants
          configMap:
            name: audit-grants
        - name: keys
          persistentVolumeClaim:
            claimName: audit-keys
            readOnly: true
        
        
        - name: secret-0
          secret:
            secretName: audit-key-root
        - name: token-0
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: "audit"
                  expirationSeconds: 3600
        - name: tmp
          emptyDir: {}

