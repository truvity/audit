# Source: audit/templates/serviceaccount.yaml
# Reading is a different privilege from writing: this identity reads the
# archive and writes exports, and holds a key only to open sealed identifiers
# if it may resolve. Pod Identity, IRSA or an OpenBAO role binds here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-query
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: audit/templates/serviceaccount.yaml
# Sealing is a different privilege from writing: whoever can write the archive
# and can also sign for it can choose what to sign. This identity reads the
# records, puts seals and keys/roots.jwks, and uses the seal key; the writer's
# role has no use of that key, and this one has no write to records/.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-notary
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: audit/templates/serviceaccount.yaml
# Verification needs to read the archive and nothing else. An auditor running
# the same command must get the same answer, which is what makes the answer
# worth having.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-verify
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: audit/templates/serviceaccount.yaml
# Clock sync only records what it measured through the writer's sink. It needs
# no cloud rights at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-clock-sync
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm

---
# Source: audit/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-deployment
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  # The document a config names as `deployment`: which presets each profile is
  # composed from, and where its copies land. Every component that reads
  # profiles reads this one, because retention is a property of the profile and
  # every one of them needs to agree about it.
  deployment.yaml: |
    external_identifiers_are_opaque: false
    profiles:
      security:
        presets:
        - security

---
# Source: audit/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-writer-config
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: writer
data:
  # What the binary reads with --config: validated against
  # schemas/config/ at start-up, and by this chart's values.schema.json before
  # it renders.
  config.yaml: |
    anonymousWrites: true
    archive:
      bucket:
        name: audit-archive
    database:
      passwordEnv: AUDIT_DATABASE_PASSWORD
      url: postgres://audit_writer@db.example.test:5432/audit?sslmode=verify-full&sslrootcert=/etc/audit/trust/ca.crt
    deployment: /etc/audit/deployment.yaml
    keys:
      provider: transit
      transit:
        openbao:
          address: https://openbao.example:8200
          caFile: /etc/audit/trust/ca.crt
          login:
            jwtFile: /var/run/openbao/token
            mount: jwt-devel
            role: audit-writer
          namespace: devel
    replicas: 3

---
# Source: audit/templates/cronjobs.yaml
# Hourly. Seals the hours that have closed and settled since the last seal, for
# every profile and tenant, into the signed chain: one seal per hour, empty
# hours too, each naming the one before. It resumes past a missed run on its
# own, so a failed hour needs no operator, and a rerun of a sealed hour writes
# nothing. It signs, and it runs as an identity of its own that the writer's is
# not: whoever can write the archive and can also sign for it can choose what
# to sign.
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-notary-config
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: notary
data:
  # What the binary reads with --config: validated against
  # schemas/config/ at start-up, and by this chart's values.schema.json before
  # it renders.
  config.yaml: |
    archive:
      bucket:
        name: audit-archive
    signer:
      transit:
        key: audit-seal
        openbao:
          address: https://openbao.example:8200
          caFile: /etc/audit/trust/ca.crt
          login:
            jwtFile: /var/run/openbao/token
            mount: jwt-devel
            role: audit-notary
          namespace: devel

---
# Source: audit/templates/cronjobs.yaml
# Nightly. Checks each profile's record objects of the last day against the
# bucket contract (key, metadata, sha256, the hash of every record) and, with
# `seals.roots`, the seals too: their signatures against the pinned roots, the
# chain, each hour's count and root against its objects, and that no due seal is
# missing. It reports what it finds; a non-zero exit is the alert. It reads the
# archive and nothing else, which is what lets an auditor run the same command
# and get the same answer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-verify-config
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: verify
data:
  # What the binary reads with --config: validated against
  # schemas/config/ at start-up, and by this chart's values.schema.json before
  # it renders.
  config.yaml: |
    archive:
      bucket:
        name: audit-archive
    deployment: /etc/audit/deployment.yaml

---
# Source: audit/templates/cronjobs.yaml
# Daily. Compares this cluster's clock with UTC and records the answer, which is
# what ETSI EN 319 401 7.10 asks for. It never sets the clock. A drift beyond
# the tolerance fails the run, so the job going red is the alert.
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-clock-sync-config
  labels:
    helm.sh/chart: audit-0.0.0
    app.kubernetes.io/name: audit
    app.kubernetes.io/instance: audit
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: clock-sync
data:
  # What the binary reads with --config: validated against
  # schemas/config/ at start-up, and by this chart's values.schema.json before
  # it renders.
  config.yaml: |
    ntp:
    - time.cloudflare.com

