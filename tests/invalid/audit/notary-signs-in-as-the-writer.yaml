# refuse: the notary signs in to OpenBAO as the writer
# base: separation-base
jobs:
  notary:
    enabled: true
    config:
      archive:
        bucket:
          name: audit-archive
      signer:
        transit:
          key: audit-seal
          openbao:
            address: https://openbao.example.test:8200
            login:
              mount: jwt-devel
              role: audit-writer
              jwtFile: /var/run/openbao/token
