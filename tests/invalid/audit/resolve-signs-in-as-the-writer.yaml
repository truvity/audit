# refuse: signs in as the writer
# base: separation-base
query:
  enabled: true
  grants:
    issuers:
      - url: https://id.example.test
        audience: audit
  config:
    grants: /etc/audit/grants.yaml
    sink:
      url: http://audit:8080
    searcher: s3scan
    archive:
      bucket:
        name: audit-archive
    keys:
      provider: transit
      transit:
        openbao:
          address: https://openbao.example.test:8200
          login:
            mount: jwt-devel
            role: audit-writer
            jwtFile: /var/run/openbao/token
